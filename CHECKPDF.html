<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bannière Preflight PDF - Typographique</title>
    <style>
        :root {
            --bg-color: #161b22; /* Fond gris foncé uni */
            --accent-green: #4caf50;
            --text-muted: #607d8b;
            --text-light: #eceff1;
            --laser-color: #00e5ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Conteneur de la Bannière - Épuré, sans cadre, fond uni */
        .preflight-banner {
            width: 100%;
            max-width: 900px;
            height: 180px;
            background-color: var(--bg-color);
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
        }

        /* --- ZONE GAUCHE : TITRES ET ÉTAT DU MOTEUR --- */
        .preflight-status {
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        .title {
            color: var(--text-light);
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        /* Indicateur de statut "Moteur Actif" */
        .engine-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: pulseStatus 1s infinite alternate;
            animation-delay: 1.5s; /* Commence quand la validation réussit */
        }

        @keyframes pulseStatus {
            from { background-color: var(--text-muted); opacity: 0.5; }
            to { background-color: var(--accent-green); opacity: 1; box-shadow: 0 0 8px var(--accent-green); }
        }

        /* --- ZONE DROITE : LISTES DE CONTRÔLE ET SCANNER --- */
        .preflight-checklists {
            position: relative;
            display: flex;
            gap: 30px;
            z-index: 2;
        }

        .check-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .check-item {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* Séquencement de l'animation de validation (passage au vert) */
        .check-item {
            animation: itemValidate 0.2s forwards;
            animation-play-state: paused;
        }

        /* --- DESIGN DU SCANNER LASER --- */
        .visual-scanner {
            position: relative;
            width: 250px;
            height: 140px;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #253046;
            background-color: rgba(22, 27, 34, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .visual-scanner::before {
            content: 'SCANNING...';
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 2px;
            position: absolute;
            top: 10px;
            left: 15px;
            opacity: 0.6;
        }

        /* Ligne Laser qui balaie la zone */
        .laser-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--laser-color), transparent);
            box-shadow: 0 0 12px var(--laser-color), 0 0 4px var(--laser-color);
            top: -5px;
            opacity: 0;
            animation: scanMouvement 1.8s ease-in-out forwards;
            animation-delay: 0.2s;
        }

        /* Notification de Validation Finale (Badge textuel) */
        .validation-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: scale(0.8);
            animation: popValidation 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 2s;
        }

        .badge-icon {
            font-size: 32px;
            color: var(--accent-green);
            animation: pulseBadgeIcon 1s infinite alternate 2.5s;
        }

        .badge-text {
            color: var(--text-light);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- DESIGN DES ANIMATIONS CSS --- */

        /* 1. Mouvement de balayage du laser */
        @keyframes scanMouvement {
            0% { top: -5px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 145px; opacity: 0; }
        }

        /* 2. Apparition et validation des items de la liste (déclenchée par JS au moment du scan) */
        @keyframes itemValidate {
            0% { color: var(--text-muted); opacity: 0.8; }
            100% { color: var(--text-light); opacity: 1; text-shadow: 0 0 5px var(--accent-green); }
        }

        /* 3. Pop de la notification finale de validation */
        @keyframes popValidation {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 4. Pulsation finale sur l'icône de validation */
        @keyframes pulseBadgeIcon {
            from { text-shadow: 0 0 5px var(--accent-green), 0 0 10px var(--accent-green); }
            to { text-shadow: 0 0 15px var(--accent-green), 0 0 30px var(--accent-green); }
        }

    </style>
</head>
<body>

    <div class="preflight-banner">
        
        <div class="preflight-status">
            <span class="subtitle">PDF Production Engine</span>
            <h2 class="title">Contrôle de conformité automatique</h2>
            <div class="engine-status">
                <div class="status-dot"></div>
                <span id="status-text">ANALYSING...</span>
            </div>
        </div>

        <div class="visual-scanner">
            <div class="laser-line"></div>
            
            <div id="scanning-content">
                <ul class="check-column" id="check-list">
                    <li class="check-item">[Fonts Embedded]</li>
                    <li class="check-item">[CMYK Profiles]</li>
                    <li class="check-item">[Bleed Box: OK]</li>
                </ul>
            </div>

            <div class="validation-badge">
                <span class="badge-icon">✓</span>
                <span class="badge-text">PASSED</span>
            </div>
        </div>

    </div>

    <script>
        const laser = document.querySelector('.laser-line');
        const items = document.querySelectorAll('.check-item');
        const list = document.getElementById('check-list');
        const scanningContent = document.getElementById('scanning-content');
        const statusText = document.getElementById('status-text');

        // On synchronise la validation des items de la liste avec la position de la ligne laser
        items.forEach((item, index) => {
            setTimeout(() => {
                item.style.animationPlayState = 'running';
            }, (200 + index * 400)); // Décalage pour suivre le passage du laser
        });

        // Quand le scan est terminé, on cache la liste et on change le texte de statut
        setTimeout(() => {
            scanningContent.style.display = 'none';
            statusText.innerText = 'ENGINE READY';
            statusText.style.color = '#eceff1'; // Text light
        }, 1800); // Durée totale du scan laser

    </script>

</body>
</html>
