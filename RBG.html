        const shapes = new SVGLoader().parse(svgString).paths.map(p => p.toShapes(true)).flat();
        const geometry = new THREE.ExtrudeGeometry(shapes, { depth: 20, bevelEnabled: true, bevelThickness: 2, bevelSize: 2, curveSegments: 64 });
        geometry.center();
        geometry.scale(0.12, -0.12, 0.12);

        const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xFFC107 }));
        scene.add(mesh);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const rgbPass = new ShaderPass(RGBShiftShader);
        rgbPass.uniforms['amount'].value = 0.005;
        composer.addPass(rgbPass);

        camera.position.z = 100;

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.y += 0.01;
            composer.render();
        }
        animate();
