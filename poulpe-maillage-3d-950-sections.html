<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#000;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        width:100vw;
        cursor:grab;
        user-select:none;
    }

    body:active{
        cursor:grabbing;
    }

    canvas{
        display:block;
    }

    /* Vignette premium */
    body::after{
        content:'';
        position:fixed;
        inset:0;
        pointer-events:none;

        background:
        radial-gradient(
            circle,
            transparent 55%,
            rgba(0,0,0,0.65) 100%
        );
    }
</style>

5.3-7,6.2-10.5,14-10,23.5l5.3-.2c.9-5.7,2.4-10,6.4-13.9,9.1-8.9,24.3-12.2,35.7-5.2,10.3,6.3,16.9,18.6,17,30.7s-.7,13.8-3,19.7c-10,24.7-29.2,47.9-52,62-18.1,11.2-41.7,8.2-55.8-7.9-7-8-9.9-18.4-8.2-28.9,2.6-16,8.7-30.4,17.6-43.9,9.3-14,20-26.3,32.4-37.9l59-55.1c21.5-20.1,37.4-43.6,49.3-71.6,12.2,30.5,31.3,55.2,54.9,77.2l59,55c21,21.9,40.8,47.8,44.3,78.4s-3.3,22.6-11.9,30.3c-16.2,14.3-38.6,14.4-56.3,1.9-21.4-15.1-38.4-35.9-48.3-60.5-2.2-5.6-2.7-12.6-2.7-18.7,0-12.5,6.9-25.3,18.3-31.4Z"/>
</svg>

<script>

const canvas = document.getElementById('renderCanvas');
const ctx = canvas.getContext('2d');

let SIZE = Math.min(window.innerWidth, window.innerHeight);

canvas.width = SIZE;
canvas.height = SIZE;

const vertices = [];
const edges = [];

const svgPath = document.querySelector('#octopusSource path');

const pathLength = svgPath.getTotalLength();

const totalSections = 950;
const meshDepth = 0.09;

const backbone = [];

for(let i=0;i<=totalSections;i++){

    backbone.push(
        svgPath.getPointAtLength(
            (i/totalSections)*pathLength
        )
    );
}

for(let i=0;i<=totalSections;i++){

    const current = backbone[i];
    const next = backbone[i+1] || current;
    const prev = backbone[i-1] || current;

    let dx = next.x - prev.x;
    let dy = next.y - prev.y;

    let len = Math.sqrt(dx*dx + dy*dy) || 1;

    let nx = -dy / len;
    let ny = dx / len;

    let cx = (current.x - 383) / 383;
    let cy = -(current.y - 380) / 380;

    const baseIdx = vertices.length;

    const pulse = Math.sin(i * 0.09) * 0.004;
    const thickness = 0.015 + pulse;

    const tx = dx / len;
    const ty = dy / len;

    const ringSegments = 12;

    for(let j=0;j<ringSegments;j++){

        const a = (j/ringSegments)*Math.PI*2;

        const organicNoise =
            Math.sin(i*0.12 + j*0.8)*0.003 +
            Math.cos(i*0.07 - j*1.1)*0.002;

        const radius = thickness + organicNoise;

        const ox =
            Math.cos(a)*nx*radius +
            Math.sin(a)*tx*radius*0.6;

        const oy =
            Math.cos(a)*ny*radius +
            Math.sin(a)*ty*radius*0.6;

        const oz = Math.sin(a)*meshDepth;

        vertices.push({
            x: cx + ox,
            y: cy + oy,
            z: oz
        });
    }

    for(let j=0;j<ringSegments;j++){

        const currentIdx = baseIdx + j;
        const nextIdx = baseIdx + ((j+1)%ringSegments);

        edges.push([currentIdx, nextIdx]);

        if(i>0){

            const prevBase = baseIdx - ringSegments;

            edges.push([prevBase+j, currentIdx]);
            edges.push([prevBase+j, nextIdx]);
        }
    }
}

/* PARTICULES */

const particles = [];

for(let i=0;i<120;i++){

    particles.push({

        x: Math.random()*SIZE,
        y: Math.random()*SIZE,

        speed: 0.1 + Math.random()*0.4,

        size: Math.random()*2,

        alpha: Math.random()*0.5
    });
}

function rotateY(pt, angle){

    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    return {

        x: pt.x*cos - pt.z*sin,
        y: pt.y,
        z: pt.x*sin + pt.z*cos
    };
}

function rotateX(pt, angle){

    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    return {

        x: pt.x,
        y: pt.y*cos - pt.z*sin,
        z: pt.y*sin + pt.z*cos
    };
}

function project(pt){

    const cameraZ = 2.3;

    const zFinal = pt.z + cameraZ;

    return {

        x: pt.x / zFinal,
        y: pt.y / zFinal,
        zCalculated: pt.z
    };
}

let breathing = 1;

function toScreen(pt2d){

    const scale = SIZE * 0.95 * breathing;

    return {

        x: (pt2d.x * scale) + (SIZE/2),
        y: (-pt2d.y * scale) + (SIZE/2)
    };
}

let targetRotX = 0.35;
let targetRotY = 0.45;

let currentRotX = 0.35;
let currentRotY = 0.45;

let isDragging = false;

let lastMouse = {x:0,y:0};

let runTime = 0;

window.addEventListener('mousedown', e=>{

    isDragging = true;

    lastMouse = {

        x:e.clientX,
        y:e.clientY
    };
});

window.addEventListener('mouseup', ()=>{

    isDragging = false;
});

window.addEventListener('mousemove', e=>{

    if(isDragging){

        targetRotY += (e.clientX-lastMouse.x)*0.007;
        targetRotX += (e.clientY-lastMouse.y)*0.007;

        lastMouse = {

            x:e.clientX,
            y:e.clientY
        };
    }
});

function drawParticles(){

    for(const p of particles){

        p.y -= p.speed;

        if(p.y < 0){

            p.y = SIZE;
            p.x = Math.random()*SIZE;
        }

        ctx.globalAlpha = p.alpha;

        ctx.fillStyle = '#00d9ff';

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}

function loop(){

    runTime += 0.004;

    breathing = 1 + Math.sin(runTime*2)*0.015;

    /* MOTION BLUR */

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0,0,SIZE,SIZE);

    /* BACKGROUND PREMIUM */

    const bg = ctx.createRadialGradient(
        SIZE/2,
        SIZE/2,
        100,
        SIZE/2,
        SIZE/2,
        SIZE
    );

    bg.addColorStop(0, '#06141d');
    bg.addColorStop(1, '#000000');

    ctx.fillStyle = bg;

    ctx.fillRect(0,0,SIZE,SIZE);

    drawParticles();

    if(!isDragging){

        targetRotY += 0.0025;

        currentRotX +=
            (targetRotX + Math.sin(runTime)*0.03 - currentRotX)
            *0.05;

        currentRotY +=
            (targetRotY - currentRotY)
            *0.05;

    }else{

        currentRotX +=
            (targetRotX-currentRotX)
            *0.15;

        currentRotY +=
            (targetRotY-currentRotY)
            *0.15;
    }

    const projectedPoints = [];

    for(let i=0;i<vertices.length;i++){

        let pt = rotateX(vertices[i], currentRotX);

        pt = rotateY(pt, currentRotY);

        let proj = project(pt);

        let scr = toScreen(proj);

        /* DISTORSION AQUATIQUE */

        scr.x +=
            Math.sin(runTime*2 + scr.y*0.01)*1.2;

        scr.z = proj.zCalculated;

        projectedPoints.push(scr);
    }

    const bucket0 = [];
    const bucket1 = [];
    const bucket2 = [];
    const bucket3 = [];

    for(let i=0;i<edges.length;i++){

        const idA = edges[i][0];
        const idB = edges[i][1];

        const pA = projectedPoints[idA];
        const pB = projectedPoints[idB];

        const avgZ = (pA.z + pB.z)/2;

        if(avgZ < -0.06){

            bucket0.push(pA,pB);

        }else if(avgZ < 0){

            bucket1.push(pA,pB);

        }else if(avgZ < 0.06){

            bucket2.push(pA,pB);

        }else{

            bucket3.push(pA,pB);
        }
    }

    function drawBucket(bucket, color, width, glow=false){

        if(bucket.length===0) return;

        ctx.beginPath();

        ctx.strokeStyle = color;

        ctx.lineWidth = width;

        if(glow){

            ctx.shadowBlur = 12;
            ctx.shadowColor = color;

            ctx.globalCompositeOperation = 'lighter';
        }

        for(let i=0;i<bucket.length;i+=2){

            ctx.moveTo(bucket[i].x, bucket[i].y);

            ctx.lineTo(
                bucket[i+1].x,
                bucket[i+1].y
            );
        }

        ctx.stroke();

        ctx.shadowBlur = 0;

        ctx.globalCompositeOperation = 'source-over';
    }

    drawBucket(bucket0, '#041b35', 0.5);
    drawBucket(bucket1, '#005580', 0.7);
    drawBucket(bucket2, '#00a6f0', 0.9);

    const hue = 185 + Math.sin(runTime)*20;

    drawBucket(
        bucket3,
        `hsl(${hue},100%,60%)`,
        1.4,
        true
    );

    requestAnimationFrame(loop);
}

loop();

window.addEventListener('resize', ()=>{

    SIZE = Math.min(
        window.innerWidth,
        window.innerHeight
    );

    canvas.width = SIZE;
    canvas.height = SIZE;
});

</script>
