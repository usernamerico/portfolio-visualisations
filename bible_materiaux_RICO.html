<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Bible Materiaux — Poulpe Media</title>
<style>
:root{--bg:#f4f4f2;--surface:#fff;--border:#e8e8e6;--text:#1a1a1a;--muted:#888;--r:8px;--accent:#444;--cat-color:#444}
[data-dark]{--bg:#0f0f0f;--surface:#1a1a1a;--border:#2a2a2a;--text:#e8e8e6;--muted:#666}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;cursor:none}

/* CURSOR */
.cursor{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--text);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .1s,background .2s,width .2s,height .2s;mix-blend-mode:difference}
.cursor.big{width:28px;height:28px;background:rgba(100,100,100,.2)}

/* PROGRESS */
.pb{position:fixed;top:0;left:0;height:2px;width:0%;z-index:998;transition:width .08s linear,background .5s}

/* SPLASH */
#splash{position:fixed;inset:0;background:#0f0f0f;z-index:9990;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,transform .6s}
#splash.hide{opacity:0;pointer-events:none;transform:scale(1.04)}
.splash-title{font-family:'Courier New',monospace;font-size:clamp(18px,4vw,32px);color:#fff;letter-spacing:.3em;animation:typeIn 1.2s steps(16) both}
.splash-sub{font-size:11px;color:#555;letter-spacing:.5em;margin-top:12px;animation:fadeIn .5s .8s both}
.splash-bar{width:200px;height:1px;background:#222;margin-top:24px;overflow:hidden}
.splash-bar-inner{height:100%;background:#555;animation:loadBar 1.4s ease both}
@keyframes typeIn{from{width:0;overflow:hidden}to{width:100%}}
@keyframes loadBar{from{width:0}to{width:100%}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* MARQUEE */
.mw{background:#0f0f0f;border-bottom:1px solid #1e1e1e;overflow:hidden;position:relative;height:28px}
.mw::before,.mw::after{content:'';position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.mw::before{left:0;background:linear-gradient(to right,#0f0f0f,transparent)}
.mw::after{right:0;background:linear-gradient(to left,#0f0f0f,transparent)}
.mt{display:flex;width:max-content;animation:mq 24s linear infinite;height:28px;align-items:center}
.mt:hover{animation-play-state:paused}
.mi{display:flex;align-items:center;gap:52px;padding:0 64px;font-family:'Courier New',monospace;font-size:9px;letter-spacing:.45em;color:#444;white-space:nowrap;transition:color .3s}
.mw:hover .mi{color:#777}
.ms{width:3px;height:3px;border-radius:50%;background:#333;flex-shrink:0}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* HEADER */
.ph{padding:1rem 1.25rem .5rem;animation:fd .6s ease both;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ph-left{display:flex;align-items:baseline;gap:10px}
.pt{font-size:14px;font-weight:600;letter-spacing:.05em}
.ps{font-size:10px;color:var(--muted);letter-spacing:.08em}
.ph-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:28px;height:28px;border-radius:50%;border:.5px solid var(--border);background:var(--surface);cursor:none;display:flex;align-items:center;justify-content:center;font-size:12px;transition:background .2s,transform .15s;user-select:none}
.icon-btn:hover{background:var(--border);transform:scale(1.08)}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* TOOLBAR */
.tb{display:flex;gap:8px;flex-wrap:wrap;padding:.6rem 1.25rem;align-items:center;position:sticky;top:0;z-index:10;background:rgba(244,244,242,.93);backdrop-filter:blur(10px);border-bottom:.5px solid var(--border);transition:background .3s}
[data-dark] .tb{background:rgba(15,15,15,.93)}
.sw{flex:1;min-width:200px;position:relative}
.sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none;transition:stroke .2s}
.sw:focus-within svg{stroke:var(--text)}
input[type=search]{width:100%;padding:6px 32px 6px 28px;font-size:12px;border:.5px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;cursor:none}
input[type=search]:focus{border-color:var(--muted);box-shadow:0 0 0 3px rgba(128,128,128,.1)}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:14px;cursor:none;color:var(--muted);display:none;background:none;border:none;padding:2px 4px;line-height:1}
.clear-btn.vis{display:block}
.fi{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:10px;padding:3px 10px;border-radius:20px;cursor:none;border:1.5px solid;background:var(--surface);transition:all .18s;user-select:none;font-weight:500;position:relative;overflow:hidden;white-space:nowrap}
.pill::after{content:'';position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.pill:hover::after{opacity:.07}
.pill .pcnt{font-size:9px;opacity:.6;margin-left:3px}
.sc{font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto;transition:all .2s}
.fin-filters{display:flex;gap:4px;flex-wrap:wrap;padding:.3rem 1.25rem 0;animation:fd .5s .2s both}
.fin-pill{font-size:9px;padding:2px 8px;border-radius:12px;cursor:none;border:.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s;user-select:none}
.fin-pill.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.sort-bar{display:flex;gap:6px;padding:.3rem 1.25rem .4rem;align-items:center;font-size:10px;color:var(--muted)}
.sort-btn{font-size:10px;padding:2px 8px;border-radius:12px;cursor:none;border:.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s;user-select:none}
.sort-btn.active{background:var(--text);color:var(--bg)}

/* NAV LATERALE */
.sidenav{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.sn-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:none;transition:all .2s;title:attr(data-label)}
.sn-dot:hover,.sn-dot.active{transform:scale(1.5)}
.sn-dot.active{border-color:var(--cat-color);background:var(--cat-color)}

/* CONTENT */
.ct{padding:.75rem 1.25rem 2rem}
.cs{margin-bottom:1.25rem;animation:si .35s ease both}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ch{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);margin-bottom:5px;font-size:11px;font-weight:600;letter-spacing:.05em;cursor:none;user-select:none;transition:opacity .15s,transform .15s}
.ch:hover{opacity:.85;transform:translateX(2px)}
.cd{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:transform .2s}
.ch:hover .cd{transform:scale(1.3)}
.cc{margin-left:auto;font-size:9px;opacity:.55;font-weight:400}
.cb{overflow:hidden;transition:max-height .3s ease,opacity .25s ease}
.cb.col{max-height:0!important;opacity:0}

/* ROWS */
.mr{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;border:.5px solid var(--border);background:var(--surface);margin-bottom:3px;flex-wrap:wrap;cursor:none;transition:background .15s,border-color .15s,transform .18s,box-shadow .18s;animation:ri .28s ease both;position:relative;overflow:hidden;border-left:2px solid transparent}
.mr::before{content:'';position:absolute;inset:0;background:var(--ripple-color,rgba(0,0,0,.06));border-radius:6px;transform:scale(0);opacity:0;transition:transform .4s,opacity .4s;pointer-events:none}
.mr.ripple::before{transform:scale(1);opacity:1}
.mr:hover{background:var(--surface);border-color:var(--cat-border,#ccc);transform:translateX(3px);box-shadow:0 2px 8px rgba(0,0,0,.07);border-left-color:var(--cat-color-row,#ccc)}
.mr.ex{background:var(--surface);border-color:var(--cat-border,#bbb);border-left-color:var(--cat-color-row,#aaa)}
.mr.stopped-row{opacity:.5}
.mr.stopped-row .mc::after{content:' ●';color:#e74c3c;font-size:8px}
@keyframes ri{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
.mc{font-family:monospace;font-size:10px;color:var(--muted);min-width:90px;flex-shrink:0;cursor:none;transition:color .15s;user-select:none;position:relative}
.mc:hover{color:var(--text)}
.mc .copied{position:absolute;top:-18px;left:0;font-size:9px;background:var(--text);color:var(--bg);padding:2px 5px;border-radius:3px;white-space:nowrap;animation:popUp .8s ease forwards;pointer-events:none}
@keyframes popUp{0%{opacity:0;transform:translateY(4px)}20%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
.mn{color:var(--text);font-size:12px;flex:1;min-width:130px}
.mn mark{background:#fef3c7;color:#78350f;border-radius:2px;padding:0 1px}
[data-dark] .mn mark{background:#78350f;color:#fef3c7}
.mf{font-size:9px;padding:1px 6px;border-radius:3px;background:var(--bg);color:var(--muted);border:.5px solid var(--border);white-space:nowrap;flex-shrink:0;letter-spacing:.03em;cursor:none;transition:background .2s}
.mf:hover{background:var(--text);color:var(--bg)}
.stopped-badge{font-size:8px;padding:1px 5px;border-radius:3px;background:#fef2f2;color:#e74c3c;border:.5px solid #fca5a5;white-space:nowrap;flex-shrink:0;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.lz-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.lz{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);color:var(--text);border:.5px solid var(--border);white-space:nowrap;transition:background .15s,transform .15s,border-color .15s;cursor:none}
.lz:hover{transform:scale(1.08);border-color:var(--muted)}
.lz.match{background:#fef3c7;color:#78350f;font-weight:600;border-color:#f59e0b;animation:pu .35s ease}
[data-dark] .lz.match{background:#78350f;color:#fef3c7;border-color:#b45309}
@keyframes pu{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}

/* DETAIL */
.md{overflow:hidden;max-height:0;opacity:0;transition:max-height .28s ease,opacity .28s ease,padding .2s;font-size:11px;color:var(--muted);padding:0 10px;line-height:1.7;border-left:2px solid var(--border);margin:0 0 3px 10px;border-radius:0 0 4px 4px}
.md.open{max-height:100px;opacity:1;padding:5px 10px 6px}

/* TOOLTIP FINITION */
.fin-tip{position:fixed;background:var(--text);color:var(--bg);font-size:10px;padding:4px 8px;border-radius:4px;pointer-events:none;z-index:500;white-space:nowrap;opacity:0;transition:opacity .15s;transform:translate(-50%,-100%) translateY(-6px)}
.fin-tip.vis{opacity:1}

/* SCROLL TOP */
.stb{position:fixed;bottom:20px;right:24px;width:32px;height:32px;background:var(--surface);border:.5px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:none;box-shadow:0 2px 8px rgba(0,0,0,.1);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s,background .2s;z-index:100;font-size:12px;color:var(--muted)}
.stb.vis{opacity:1;transform:translateY(0)}
.stb:hover{background:var(--border)}

/* EMPTY */
.empty{padding:3rem;text-align:center;color:var(--muted);font-size:13px;animation:shake .4s ease}
.empty span{display:block;font-size:28px;margin-bottom:8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* KONAMI */
#konami{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9995;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#konami.show{display:flex}
#konami p{color:#fff;font-family:'Courier New',monospace;font-size:clamp(14px,3vw,24px);letter-spacing:.2em;animation:rainbow 1s linear infinite}
@keyframes rainbow{0%{color:#ff0000}16%{color:#ff8800}33%{color:#ffff00}50%{color:#00ff00}66%{color:#0088ff}83%{color:#8800ff}100%{color:#ff0000}}

/* BG teinté selon cat */
body{transition:background .6s}
</style>
</head>

  var pct=t>0?s/t*100:0;
  pb.style.width=pct+"%";
  var cat=getActiveSectionCat();
  var c=CATS.find(function(x){return x.cat===cat});
  pb.style.background=c?c.color:"#888";
  document.getElementById("stb").classList.toggle("vis",s>300);
  updateSidenav();
},{passive:true});

/* ── SCROLL TOP ── */
document.getElementById("stb").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});

/* ── EXPAND ALL ── */
document.getElementById("expandBtn").addEventListener("click",function(){
  allExpanded=!allExpanded;
  this.textContent=allExpanded?"⊟":"⊞";
  DATA.forEach(function(s,si){collapsed[s.cat+si]=!allExpanded});
  render();
});

/* ── FINITION FILTERS ── */
var ALL_FINS=["MAT","BRILLANT","TRANSP","SATIN","MIROIR","CLEAR","BROSSE","DEPOLI"];
function buildFinFilters(){
  var el=document.getElementById("finFilters");
  el.innerHTML='<span style="font-size:10px;color:var(--muted);margin-right:4px">Finition :</span>';
  var all=document.createElement("span");
  all.className="fin-pill active";all.textContent="Tout";all.dataset.fin="all";
  all.addEventListener("click",function(){activeFin="all";document.querySelectorAll(".fin-pill").forEach(function(p){p.classList.remove("active")});all.classList.add("active");render()});
  el.appendChild(all);
  ALL_FINS.forEach(function(f){
    var sp=document.createElement("span");sp.className="fin-pill";sp.textContent=f;sp.dataset.fin=f;
    sp.addEventListener("click",function(){
      activeFin=f;document.querySelectorAll(".fin-pill").forEach(function(p){p.classList.remove("active")});sp.classList.add("active");render()
    });
    el.appendChild(sp);
  });
}

/* ── SORT ── */
document.querySelectorAll(".sort-btn").forEach(function(b){
  b.addEventListener("click",function(){
    sortMode=b.dataset.sort;
    document.querySelectorAll(".sort-btn").forEach(function(x){x.classList.remove("active")});
    b.classList.add("active");render();
  });
});

/* ── SIDENAV ── */
function buildSidenav(){
  var nav=document.getElementById("sidenav");
  nav.innerHTML="";
  DATA.forEach(function(s){
    if(activeCat!=="all"&&activeCat!==s.cat)return;
    var dot=document.createElement("div");dot.className="sn-dot";dot.title=s.label;
    dot.style.setProperty("--cat-color",s.color);
    dot.dataset.sec=s.cat;
    dot.addEventListener("click",function(){
      var el=document.getElementById("sec-"+s.cat);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
    });
    nav.appendChild(dot);
  });
}
function updateSidenav(){
  var sections=document.querySelectorAll(".cs[data-cat]");
  var active=null;
  sections.forEach(function(s){
    var rect=s.getBoundingClientRect();
    if(rect.top<=120&&rect.bottom>80)active=s.dataset.cat;
  });
  document.querySelectorAll(".sn-dot").forEach(function(d){
    d.classList.toggle("active",d.dataset.sec===active);
    var c=CATS.find(function(x){return x.cat===d.dataset.sec});
    if(d.classList.contains("active")&&c)d.style.background=c.color;
    else d.style.background="var(--surface)";
  });
}
function getActiveSectionCat(){
  var sections=document.querySelectorAll(".cs[data-cat]");
  var active="all";
  sections.forEach(function(s){
    var rect=s.getBoundingClientRect();
    if(rect.top<=120&&rect.bottom>80)active=s.dataset.cat;
  });
  return active;
}

/* ── FILTERS ── */
function buildFilters(){
  var el=document.getElementById("filters");
  CATS.forEach(function(c){
    var cnt=c.cat==="all"?DATA.reduce(function(a,s){return a+s.mats.length},0):
      (DATA.find(function(s){return s.cat===c.cat})||{mats:[]}).mats.length;
    var span=document.createElement("span");
    span.className="pill";span.dataset.cat=c.cat;
    span.innerHTML=c.label+'<span class="pcnt">'+cnt+'</span>';
    span.style.borderColor=c.color;span.style.color=c.color;
    if(c.cat==="all"){span.style.background=c.color;span.style.color="#fff"}
    span.addEventListener("click",function(){
      document.querySelectorAll(".pill").forEach(function(p){
        var pc=CATS.find(function(x){return x.cat===p.dataset.cat});
        p.style.background="var(--surface)";p.style.color=pc?pc.color:"#555";p.style.borderColor=pc?pc.color:"#555"
      });
      span.style.background=c.color;span.style.color=c.cat==="jaune"?"#3d2a00":"#fff";
      activeCat=c.cat;expandedRow=null;
      document.body.style.setProperty("--bg-tint",c.cat!=="all"?c.color+"08":"");
      if(c.cat!=="all"){document.body.style.background=c.color+"06"}
      else{document.body.style.background=""}
      render();buildSidenav();
    });
    el.appendChild(span);
  });
}

/* ── HIGHLIGHT ── */
function highlight(text,q){
  if(!q)return text;
  var escaped=q.replace(/[-\[\]{}()*+?.,\\^$|#\s]/g,"\\$&");var re=new RegExp("("+escaped+")","gi");
  return text.replace(re,"<mark>$1</mark>");
}

/* ── RENDER ── */
function render(){
  var q=searchVal.trim().toLowerCase();
  var html="",total=0;

  var sections=DATA.filter(function(s){return activeCat==="all"||activeCat===s.cat});

  sections.forEach(function(section,si){
    var mats=section.mats.slice();

    // Filtre finition
    if(activeFin!=="all"){
      mats=mats.filter(function(m){return m.fin&&m.fin.indexOf(activeFin)>=0});
    }

    // Filtre recherche
    if(q){
      mats=mats.filter(function(m){
        return m.name.toLowerCase().indexOf(q)>=0||
          m.code.toLowerCase().indexOf(q)>=0||
          m.desc.toLowerCase().indexOf(q)>=0||
          m.laizes.some(function(l){return String(l).toLowerCase().indexOf(q)>=0});
      });
    }

    // Tri
    if(sortMode==="alpha"){mats=mats.slice().sort(function(a,b){return a.name.localeCompare(b.name)})}
    else if(sortMode==="code"){mats=mats.slice().sort(function(a,b){return a.code.localeCompare(b.code)})}
    else if(sortMode==="laizes"){mats=mats.slice().sort(function(a,b){return b.laizes.length-a.laizes.length})}

    if(!mats.length)return;

    var rows="";
    mats.forEach(function(mat,mi){
      var rid="r-"+section.cat+"-"+mi;
      var isExp=expandedRow===rid;
      var c=CATS.find(function(x){return x.cat===section.cat});
      var col=c?c.color:"#888";

      var lzHtml=mat.laizes.length?mat.laizes.map(function(l){
        var s=String(l),isMatch=q&&s.toLowerCase().indexOf(q)>=0;
        var unit=typeof l==="number"?" mm":"";
        return'<span class="lz'+(isMatch?" match":"")+'">'+(isMatch?highlight(s,q):s)+unit+'</span>'
      }).join(""):'<span style="font-size:10px;color:var(--muted)">—</span>';

      var finBadge=mat.fin?'<span class="mf" data-fin="'+mat.fin+'" data-tip="'+(FIN_TIPS[mat.fin]||mat.fin)+'">'+mat.fin+'</span>':"";
      var stoppedBadge=mat.stopped?'<span class="stopped-badge">ARRET</span>':"";
      var delay=(total*.018).toFixed(2)+"s";
      var nameHtml=q?highlight(mat.name,q):mat.name;

      rows+='<div class="mr'+(isExp?" ex":"")+(mat.stopped?" stopped-row":"")+'" data-rid="'+rid+'"'
        +' style="animation-delay:'+delay+';--cat-border:'+col+'44;--cat-color-row:'+col+'">'
        +'<span class="mc" data-code="'+mat.code+'" title="Cliquer pour copier">'+mat.code+'</span>'
        +'<span class="mn">'+nameHtml+'</span>'
        +finBadge+stoppedBadge
        +'<div class="lz-wrap">'+lzHtml+'</div>'
        +'</div>'
        +'<div class="md'+(isExp?" open":"")+'" id="d-'+rid+'">'+mat.desc+'</div>';
      total++;
    });

    var isCol=!!collapsed[section.cat+si];
    var c=CATS.find(function(x){return x.cat===section.cat});
    var col=c?c.color:"#888";

    html+='<div class="cs" id="sec-'+section.cat+'" data-cat="'+section.cat+'" style="animation-delay:'+(si*.04).toFixed(2)+'s">'
      +'<div class="ch" data-sec="'+section.cat+si+'" style="background:'+col+'14;color:'+col+';">'
      +'<span class="cd" style="background:'+col+'"></span>'
      +section.label
      +'<span class="cc">'+mats.length+' ref'+(mats.length>1?"s":"")+'</span>'
      +'<span style="margin-left:6px;font-size:9px;opacity:.4">'+(isCol?"▸":"▾")+'</span>'
      +'</div>'
      +'<div class="cb'+(isCol?" col":"")+'" id="body-'+section.cat+si+'" style="max-height:'+(isCol?"0":"9999px")+'">'
      +rows+'</div></div>';
  });

  var listEl=document.getElementById("list");
  listEl.innerHTML=html||'<div class="empty"><span>◎</span>Aucun resultat pour "'+searchVal+'"</div>';
  document.getElementById("stats").textContent=total+" ref"+(total>1?"s":"");

  // Section headers click
  document.querySelectorAll(".ch").forEach(function(h){
    h.addEventListener("click",function(){
      var key=h.dataset.sec;collapsed[key]=!collapsed[key];
      var body=document.getElementById("body-"+key);
      var arrow=h.querySelector("span:last-child");
      if(collapsed[key]){
        body.style.maxHeight=body.scrollHeight+"px";
        requestAnimationFrame(function(){body.style.maxHeight="0";body.classList.add("col")});
        if(arrow)arrow.textContent="▸"
      }else{
        body.classList.remove("col");body.style.maxHeight=body.scrollHeight+"px";
        setTimeout(function(){body.style.maxHeight="9999px"},300);
        if(arrow)arrow.textContent="▾"
      }
    });
  });

  // Row click — expand detail
  document.querySelectorAll(".mr").forEach(function(row){
    row.addEventListener("click",function(e){
      if(e.target.classList.contains("mc")||e.target.classList.contains("mf"))return;
      var rid=row.dataset.rid,detail=document.getElementById("d-"+rid);
      // Ripple
      row.classList.remove("ripple");void row.offsetWidth;
      row.style.setProperty("--ripple-color","rgba(128,128,128,.07)");
      row.classList.add("ripple");
      setTimeout(function(){row.classList.remove("ripple")},400);
      if(expandedRow===rid){expandedRow=null;detail.classList.remove("open");row.classList.remove("ex")}
      else{
        if(expandedRow){
          var old=document.getElementById("d-"+expandedRow);
          var oldRow=document.querySelector('[data-rid="'+expandedRow+'"]');
          if(old)old.classList.remove("open");if(oldRow)oldRow.classList.remove("ex")
        }
        expandedRow=rid;detail.classList.add("open");row.classList.add("ex")
      }
    });
  });

  // Code copy
  document.querySelectorAll(".mc").forEach(function(mc){
    mc.addEventListener("click",function(e){
      e.stopPropagation();
      var code=mc.dataset.code;
      navigator.clipboard&&navigator.clipboard.writeText(code);
      var tip=document.createElement("span");tip.className="copied";tip.textContent="Copie !";
      mc.appendChild(tip);setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip)},900);
    });
  });

  // Finition tooltip
  var finTip=document.getElementById("finTip");
  document.querySelectorAll(".mf[data-tip]").forEach(function(mf){
    mf.addEventListener("mouseenter",function(e){
      finTip.textContent=mf.dataset.tip;finTip.classList.add("vis");
    });
    mf.addEventListener("mousemove",function(e){
      finTip.style.left=e.clientX+"px";finTip.style.top=(e.clientY-8)+"px";
    });
    mf.addEventListener("mouseleave",function(){finTip.classList.remove("vis")});
    mf.addEventListener("click",function(e){e.stopPropagation()});
  });

  buildSidenav();
}

/* ── SEARCH ── */
var st;
var clearBtn=document.getElementById("clearBtn");
document.getElementById("search").addEventListener("input",function(e){
  clearTimeout(st);
  searchVal=e.target.value;
  clearBtn.classList.toggle("vis",searchVal.length>0);
  st=setTimeout(function(){expandedRow=null;render()},100);
});
clearBtn.addEventListener("click",function(){
  searchVal="";document.getElementById("search").value="";clearBtn.classList.remove("vis");expandedRow=null;render();
});

/* ── KONAMI ── */
var konamiSeq=[38,38,40,40,37,39,37,39,66,65],konamiIdx=0;
document.addEventListener("keydown",function(e){
  if(e.keyCode===konamiSeq[konamiIdx]){konamiIdx++;if(konamiIdx===konamiSeq.length){document.getElementById("konami").classList.add("show");konamiIdx=0}}
  else{konamiIdx=0}
});
document.getElementById("konami").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show")});

/* ── INIT ── */
buildFilters();buildFinFilters();render();

</script>
</body>
</html>
