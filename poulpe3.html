.9-46.8,5.3-7,6.2-10.5,14-10,23.5l5.3-.2c.9-5.7,2.4-10,6.4-13.9,9.1-8.9,24.3-12.2,35.7-5.2,10.3,6.3,16.9,18.6,17,30.7s-.7,13.8-3,19.7c-10,24.7-29.2,47.9-52,62-18.1,11.2-41.7,8.2-55.8-7.9-7-8-9.9-18.4-8.2-28.9,2.6-16,8.7-30.4,17.6-43.9,9.3-14,20-26.3,32.4-37.9l59-55.1c21.5-20.1,37.4-43.6,49.3-71.6,12.2,30.5,31.3,55.2,54.9,77.2l59,55c21,21.9,40.8,47.8,44.3,78.4s-3.3,22.6-11.9,30.3c-16.2,14.3-38.6,14.4-56.3,1.9-21.4-15.1-38.4-35.9-48.3-60.5-2.2-5.6-2.7-12.6-2.7-18.7,0-12.5,6.9-25.3,18.3-31.4Z"/>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');

        let currentSize = 750;
        let baseLineWidth = 0.6;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            currentSize = Math.floor(rect.width * dpr);
            canvas.width = currentSize;
            canvas.height = currentSize;
            baseLineWidth = (currentSize / 750) * 0.55;
        }
        window.addEventListener('resize', resizeCanvas);

        // --- GÉNÉRATION GÉOMÉTRIQUE CACHÉE ---
        const svgPath = document.querySelector('#octopusSource path');
        const pathLength = svgPath.getTotalLength();
        const totalSections = 260; 
        const meshDepth = 0.05;

        const temporaryVertices = [];
        const edgesList = [];

        const backbone = [];
        for (let i = 0; i <= totalSections; i++) {
            backbone.push(svgPath.getPointAtLength((i / totalSections) * pathLength));
        }

        for (let i = 0; i <= totalSections; i++) {
            const current = backbone[i];
            const next = backbone[i + 1] || current;
            const prev = backbone[i - 1] || current;

            let dx = next.x - prev.x;
            let dy = next.y - prev.y;
            let len = Math.sqrt(dx*dx + dy*dy) || 1;
            let nx = -dy / len;
            let ny = dx / len;

            let cx = (current.x - 383) / 383;
            let cy = -(current.y - 380) / 380;
            const thickness = 0.015;

            const baseIdx = Math.floor(temporaryVertices.length / 3);

            // Push X, Y, Z consécutifs
            temporaryVertices.push(cx + nx * thickness, cy + ny * thickness, meshDepth);
            temporaryVertices.push(cx - nx * thickness, cy - ny * thickness, meshDepth);
            temporaryVertices.push(cx + nx * thickness, cy + ny * thickness, -meshDepth);
            temporaryVertices.push(cx - nx * thickness, cy - ny * thickness, -meshDepth);

            edgesList.push(baseIdx, baseIdx + 1);
            edgesList.push(baseIdx + 2, baseIdx + 3);
            edgesList.push(baseIdx, baseIdx + 2);
            edgesList.push(baseIdx + 1, baseIdx + 3);

            if (i > 0) {
                const prevIdx = baseIdx - 4;
                edgesList.push(prevIdx, baseIdx);
                edgesList.push(prevIdx + 1, baseIdx + 1);
                edgesList.push(prevIdx + 2, baseIdx + 2);
                edgesList.push(prevIdx + 3, baseIdx + 3);
            }
        }

        // --- ENCAPSULATION EN TABLEAUX TYPÉS (FLOAT32 / INT32) ---
        // Optimisation mémoire critique : évite la fragmentation et le garbage collection
        const totalVerticesCount = Math.floor(temporaryVertices.length / 3);
        const staticVertices = new Float32Array(temporaryVertices); 
        const transformedPoints = new Float32Array(totalVerticesCount * 3); // Stocke X, Y, Z projetés à chaque frame
        const edges = new Int32Array(edgesList);

        // --- INTERACTION PHYSIQUE AVEC INERTIE ---
        let currentRotX = 0.35, currentRotY = 0.45;
        let velocityX = 0, velocityY = 0;
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let runTime = 0;

        const startDrag = (x, y) => {
            isDragging = true;
            lastMouse.x = x; lastMouse.y = y;
            velocityX = 0; velocityY = 0;
        };
        const moveDrag = (x, y) => {
            if (isDragging) {
                let diffY = (x - lastMouse.x) * 0.0055;
                let diffX = (y - lastMouse.y) * 0.0055;
                currentRotY += diffY; currentRotX += diffX;
                velocityY = diffY; velocityX = diffX;
                lastMouse.x = x; lastMouse.y = y;
            }
        };

        window.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));

        window.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY));

        // Génération de couleur ultra-rapide basée sur une chaîne pré-calculée
        function getZColorString(z, alpha = 1) {
            let factor = (z + 0.25) * 2.0; // Équivalent de /0.5
            factor = factor < 0 ? 0 : (factor > 1 ? 1 : factor);
            const g = (246 * factor + 35 * (1 - factor)) | 0;
            const b = (255 * factor + 65 * (1 - factor)) | 0;
            return alpha === 1 ? `rgb(4,${g},${b})` : `rgba(4,${g},${b},${alpha})`;
        }

        // --- BOUCLE DE RENDU ET MULTI-PASS GLOW ---
        function loop() {
            runTime += 0.006;

            // Rémanence CRT
            ctx.fillStyle = 'rgba(1, 1, 4, 0.16)';
            ctx.fillRect(0, 0, currentSize, currentSize);

            // Calculs physiques cinématiques
            if (!isDragging) {
                currentRotX += velocityX; currentRotY += velocityY;
                velocityX *= 0.95; velocityY *= 0.95;

                if (Math.abs(velocityX) < 0.0005 && Math.abs(velocityY) < 0.0005) {
                    currentRotY += 0.0022;
                    currentRotX += (0.35 + Math.sin(runTime) * 0.015 - currentRotX) * 0.05;
                }
            }

            const cosY = Math.cos(currentRotY), sinY = Math.sin(currentRotY);
            const cosX = Math.cos(currentRotX), sinX = Math.sin(currentRotX);
            const cameraZ = 2.3;
            const halfSize = currentSize * 0.5;
            const viewScale = currentSize * 0.95;

            // Étape 1 : Passage de transformation mathématique vectorielle direct (Optimisé CPU)
            for (let i = 0; i < totalVerticesCount; i++) {
                const i3 = i * 3;
                const x0 = staticVertices[i3];
                const y0 = staticVertices[i3 + 1];
                const z0 = staticVertices[i3 + 2];

                // Rotation X
                const rx = x0;
                const ry = y0 * cosX - z0 * sinX;
                const rz = y0 * sinX + z0 * cosX;

                // Rotation Y
                const fx = rx * cosY - rz * sinY;
                const fy = ry;
                const fz = rx * sinY + rz * cosY;

                // Projection
                const zFinal = fz + cameraZ;
                transformedPoints[i3] = (fx / zFinal) * viewScale + halfSize;     // Écran X
                transformedPoints[i3 + 1] = (-fy / zFinal) * viewScale + halfSize; // Écran Y
                transformedPoints[i3 + 2] = fz;                                   // Profondeur Z active
            }

            // Étape 2 : Dessin des arêtes
            const edgesCount = edges.length;

            // --- PASSE 1 : EFFET GLOW (Lignes larges, semi-transparentes en arrière-plan) ---
            for (let i = 0; i < edgesCount; i += 2) {
                const idA3 = edges[i] * 3;
                const idB3 = edges[i + 1] * 3;

                const ax = transformedPoints[idA3];
                const ay = transformedPoints[idA3 + 1];
                const az = transformedPoints[idA3 + 2];

                const bx = transformedPoints[idB3];
                const by = transformedPoints[idB3 + 1];
                const bz = transformedPoints[idB3 + 2];

                const grad = ctx.createLinearGradient(ax, ay, bx, by);
                grad.addColorStop(0, getZColorString(az, 0.22));
                grad.addColorStop(1, getZColorString(bz, 0.22));

                ctx.beginPath();
                ctx.strokeStyle = grad;
                ctx.lineWidth = baseLineWidth * 3.5; // Ligne large floutée par superposition
                ctx.moveTo(ax, ay);
                ctx.lineTo(bx, by);
                ctx.stroke();
            }

            // --- PASSE 2 : COEUR LUMINEUX (Lignes fines et éclatantes au premier plan) ---
            for (let i = 0; i < edgesCount; i += 2) {
                const idA3 = edges[i] * 3;
                const idB3 = edges[i + 1] * 3;

                const ax = transformedPoints[idA3];
                const ay = transformedPoints[idA3 + 1];
                const az = transformedPoints[idA3 + 2];

                const bx = transformedPoints[idB3];
                const by = transformedPoints[idB3 + 1];
                const bz = transformedPoints[idB3 + 2];

                const grad = ctx.createLinearGradient(ax, ay, bx, by);
                grad.addColorStop(0, getZColorString(az, 1.0));
                grad.addColorStop(1, getZColorString(bz, 1.0));

                ctx.beginPath();
                ctx.strokeStyle = grad;
                
                const midZ = (az + bz) * 0.5;
                ctx.lineWidth = baseLineWidth * (0.8 + ((midZ + 0.25) * 2.0));

                ctx.moveTo(ax, ay);
                ctx.lineTo(bx, by);
                ctx.stroke();
            }

            requestAnimationFrame(loop);
        }

        // Lancement initialisé
        resizeCanvas();
        loop();
    </script>
