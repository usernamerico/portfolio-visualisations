.9-46.8,5.3-7,6.2-10.5,14-10,23.5l5.3-.2c.9-5.7,2.4-10,6.4-13.9,9.1-8.9,24.3-12.2,35.7-5.2,10.3,6.3,16.9,18.6,17,30.7s-.7,13.8-3,19.7c-10,24.7-29.2,47.9-52,62-18.1,11.2-41.7,8.2-55.8-7.9-7-8-9.9-18.4-8.2-28.9,2.6-16,8.7-30.4,17.6-43.9,9.3-14,20-26.3,32.4-37.9l59-55.1c21.5-20.1,37.4-43.6,49.3-71.6,12.2,30.5,31.3,55.2,54.9,77.2l59,55c21,21.9,40.8,47.8,44.3,78.4s-3.3,22.6-11.9,30.3c-16.2,14.3-38.6,14.4-56.3,1.9-21.4-15.1-38.4-35.9-48.3-60.5-2.2-5.6-2.7-12.6-2.7-18.7,0-12.5,6.9-25.3,18.3-31.4Z"/>
    </svg>

    <script>
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');

        const SIZE = 750;
        canvas.width = SIZE;
        canvas.height = SIZE;

        const vertices = [];
        const edges = [];

        // Échantillonnage optimal géométrique
        const svgPath = document.querySelector('#octopusSource path');
        const pathLength = svgPath.getTotalLength();
        const totalSections = 280; 
        const meshDepth = 0.05; // Amplitude 3D réelle

        const backbone = [];
        for (let i = 0; i <= totalSections; i++) {
            backbone.push(svgPath.getPointAtLength((i / totalSections) * pathLength));
        }

        for (let i = 0; i <= totalSections; i++) {
            const current = backbone[i];
            const next = backbone[i + 1] || current;
            const prev = backbone[i - 1] || current;

            let dx = next.x - prev.x;
            let dy = next.y - prev.y;
            let len = Math.sqrt(dx*dx + dy*dy) || 1;
            let nx = -dy / len;
            let ny = dx / len;

            let cx = (current.x - 383) / 383;
            let cy = -(current.y - 380) / 380;

            const baseIdx = vertices.length;
            const thickness = 0.016;

            // Création des 4 sommets volumétriques par anneau
            vertices.push({ x: cx + nx * thickness, y: cy + ny * thickness, z: meshDepth });
            vertices.push({ x: cx - nx * thickness, y: cy - ny * thickness, z: meshDepth });
            vertices.push({ x: cx + nx * thickness, y: cy + ny * thickness, z: -meshDepth });
            vertices.push({ x: cx - nx * thickness, y: cy - ny * thickness, z: -meshDepth });

            // Liaisons structurelles de section
            edges.push([baseIdx, baseIdx + 1]);
            edges.push([baseIdx + 2, baseIdx + 3]);
            edges.push([baseIdx, baseIdx + 2]);
            edges.push([baseIdx + 1, baseIdx + 3]);

            // Liaisons longitudinales
            if (i > 0) {
                const prevIdx = baseIdx - 4;
                edges.push([prevIdx, baseIdx]);
                edges.push([prevIdx + 1, baseIdx + 1]);
                edges.push([prevIdx + 2, baseIdx + 2]);
                edges.push([prevIdx + 3, baseIdx + 3]);
            }
        }

        // --- ENGIN DE ROTATION ET PROJECTION ---
        function rotateY(pt, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return { x: pt.x * cos - pt.z * sin, y: pt.y, z: pt.x * sin + pt.z * cos };
        }

        function rotateX(pt, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return { x: pt.x, y: pt.y * cos - pt.z * sin, z: pt.y * sin + pt.z * cos };
        }

        function project(pt) {
            const cameraZ = 2.3;
            const zFinal = pt.z + cameraZ;
            return {
                x: pt.x / zFinal,
                y: pt.y / zFinal,
                zCalculated: pt.z // On garde la vraie valeur Z issue de la rotation active
            };
        }

        function toScreen(pt2d) {
            const scale = SIZE * 0.95;
            return {
                x: (pt2d.x * scale) + (SIZE / 2),
                y: (-pt2d.y * scale) + (SIZE / 2)
            };
        }

        // --- GESTION DES COMMANDES INTERACTIVES ---
        let targetRotX = 0.35, targetRotY = 0.45;
        let currentRotX = 0.35, currentRotY = 0.45;
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let runTime = 0;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                targetRotY += (e.clientX - lastMouse.x) * 0.007;
                targetRotX += (e.clientY - lastMouse.y) * 0.007;
                lastMouse = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                targetRotY += (e.touches[0].clientX - lastMouse.x) * 0.007;
                targetRotX += (e.touches[0].clientY - lastMouse.y) * 0.007;
                lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        // --- PIPELINE DE RENDU DYNAMIQUE ULTRA FLUIDE ---
        function loop() {
            runTime += 0.006;

            ctx.fillStyle = '#020206';
            ctx.fillRect(0, 0, SIZE, SIZE);

            // Interpolation et cinématique de rotation automatique
            if (!isDragging) {
                targetRotY += 0.0025;
                currentRotX += (targetRotX + Math.sin(runTime) * 0.03 - currentRotX) * 0.05;
                currentRotY += (targetRotY - currentRotY) * 0.05;
            } else {
                currentRotX += (targetRotX - currentRotX) * 0.15;
                currentRotY += (targetRotY - currentRotY) * 0.15;
            }

            // Étape 1 : Calcul des coordonnées instantanées de l'espace écran + valeur Z dynamique
            const projectedPoints = [];
            for (let i = 0; i < vertices.length; i++) {
                let pt = rotateX(vertices[i], currentRotX);
                pt = rotateY(pt, currentRotY);
                let proj = project(pt);
                let scr = toScreen(proj);
                scr.z = proj.zCalculated; // La profondeur change à CHAQUE image pour chaque sommet !
                projectedPoints.push(scr);
            }

            // Étape 2 : Distribution instantanée des arêtes dans 4 conteneurs de profondeur distincts (Z-Buckets)
            // L'intervalle théorique maximal de Z après rotation est proche de [-0.4, 0.4] selon l'inclinaison
            const bucket0 = []; // Arrière-plan lointain
            const bucket1 = []; // Arrière-plan proche
            const bucket2 = []; // Premier plan intermédiaire
            const bucket3 = []; // Premier plan absolu (Le plus proche)

            const edgesLength = edges.length;
            for (let i = 0; i < edgesLength; i++) {
                const idA = edges[i][0];
                const idB = edges[i][1];
                const pA = projectedPoints[idA];
                const pB = projectedPoints[idB];
                
                // Profondeur moyenne recalculée en temps réel pour le segment complet
                const avgZ = (pA.z + pB.z) / 2;

                // Répartition instantanée très rapide (O(N) au lieu de O(N log N) d'un tri classique)
                if (avgZ < -0.06) {
                    bucket0.push(pA, pB);
                } else if (avgZ < 0.0) {
                    bucket1.push(pA, pB);
                } else if (avgZ < 0.06) {
                    bucket2.push(pA, pB);
                } else {
                    bucket3.push(pA, pB);
                }
            }

            // Étape 3 : Dessin vectoriel optimisé par lots (Batches) avec couleurs réactives
            // Lot 0 : Fond lointain (Bleu très sombre, lignes fines)
            if (bucket0.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#041b35';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < bucket0.length; i += 2) {
                    ctx.moveTo(bucket0[i].x, bucket0[i].y);
                    ctx.lineTo(bucket0[i+1].x, bucket0[i+1].y);
                }
                ctx.stroke();
            }

            // Lot 1 : Transition arrière
            if (bucket1.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#005580';
                ctx.lineWidth = 0.7;
                for (let i = 0; i < bucket1.length; i += 2) {
                    ctx.moveTo(bucket1[i].x, bucket1[i].y);
                    ctx.lineTo(bucket1[i+1].x, bucket1[i+1].y);
                }
                ctx.stroke();
            }

            // Lot 2 : Transition avant
            if (bucket2.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#00a6f0';
                ctx.lineWidth = 0.9;
                for (let i = 0; i < bucket2.length; i += 2) {
                    ctx.moveTo(bucket2[i].x, bucket2[i].y);
                    ctx.lineTo(bucket2[i+1].x, bucket2[i+1].y);
                }
                ctx.stroke();
            }

            // Lot 3 : Premier plan lumineux (Cyan électrique, lignes épaisses)
            if (bucket3.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#00f6ff';
                ctx.lineWidth = 1.3;
                for (let i = 0; i < bucket3.length; i += 2) {
                    ctx.moveTo(bucket3[i].x, bucket3[i].y);
                    ctx.lineTo(bucket3[i+1].x, bucket3[i+1].y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
