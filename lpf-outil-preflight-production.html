<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPF Preflight</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --orange:#E8500A;--orange-light:#FDF0EA;--orange-mid:#F5A06A;
  --green:#2D7D46;--green-light:#EAF5EE;
  --red:#B91C1C;--red-light:#FEF2F2;
  --amber:#B45309;--amber-light:#FFFBEB;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-400:#9CA3AF;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
  --radius:10px;--radius-sm:6px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 12px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{--orange-light:#2a1200;--orange-mid:#7a3510;--green-light:#0a1f10;--red-light:#200808;--amber-light:#1f1400;
    --gray-50:#141414;--gray-100:#1C1C1E;--gray-200:#3A3A3C;--gray-400:#8E8E93;--gray-600:#AEAEB2;--gray-700:#C7C7CC;--gray-800:#F2F2F7;
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);--shadow:0 4px 16px rgba(0,0,0,.5);}
  body{background:#111111;}
  .header,.score-section,.stat-card,.section,.profile-bar,.report-bar,.history-panel,.preview-card{background:#1C1C1E!important;border-color:#3A3A3C!important;}
  .section-header:hover,.hist-item:hover{background:#2C2C2E!important;}
  .check-row{border-color:#2C2C2E!important;}
  .drop-zone{background:#1C1C1E!important;border-color:#3A3A3C!important;}
  .drop-zone:hover,.drop-zone.drag-over{background:#2a1a0e!important;border-color:var(--orange)!important;}
  .tip-box{background:#2a1d06!important;} .tip-box.tip-fail{background:#2a0d0d!important;}
  .recheck-btn,.btn-gray,.btn-hist{background:#2C2C2E!important;border-color:#3A3A3C!important;}
  .profile-bar select{background:#2C2C2E!important;border-color:#3A3A3C!important;color:var(--gray-800)!important;}
  .preview-wrap{background:#2C2C2E!important;}
  .hist-item{border-color:#3A3A3C!important;}
  .spot-tag{background:#3A3A3C!important;color:#C7C7CC!important;border-color:#48484A!important;}
  .badge-info{background:#3A3A3C!important;color:#AEAEB2!important;}
  .loading{background:#1C1C1E!important;border-color:#3A3A3C!important;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;font-size:14px;}
.header{background:#fff;border-bottom:1px solid var(--gray-200);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--gray-800);}
.logo-icon{width:32px;height:32px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;animation:logoFloat 3s ease-in-out infinite;}
@keyframes logoFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
.header-right{display:flex;align-items:center;gap:10px;}
.header-badge{font-size:11px;background:var(--orange-light);color:var(--orange);border:1px solid var(--orange-mid);border-radius:20px;padding:3px 10px;font-weight:600;}
.btn-hist{padding:6px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--gray-50);color:var(--gray-600);cursor:pointer;font-size:12px;font-weight:600;transition:background .15s;}
.btn-hist:hover{background:var(--gray-100);}
.top-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;pointer-events:none;}
.top-progress-bar{height:100%;background:linear-gradient(90deg,var(--orange),#f97316);width:0%;transition:width .3s ease;box-shadow:0 0 8px rgba(232,80,10,.6);}
.main{max-width:880px;margin:0 auto;padding:28px 16px;}
.profile-bar{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:var(--shadow-sm);}
.profile-bar label{font-weight:600;font-size:13px;color:var(--gray-600);white-space:nowrap;}
.profile-bar select{padding:7px 12px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;background:var(--gray-50);color:var(--gray-800);cursor:pointer;transition:border-color .15s;}
.profile-bar select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,80,10,.12);}
.profile-hint{font-size:12px;color:var(--gray-400);}
.drop-zone{border:2px dashed var(--gray-200);border-radius:var(--radius);background:#fff;padding:52px 24px;text-align:center;cursor:pointer;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s;box-shadow:var(--shadow-sm);}
.drop-zone:hover{border-color:var(--orange);background:var(--orange-light);transform:translateY(-2px);box-shadow:var(--shadow);}
.drop-zone.drag-over{border-color:var(--orange);background:var(--orange-light);transform:scale(1.01);}
.drop-icon{font-size:48px;margin-bottom:14px;display:block;transition:transform .25s;}
.drop-zone:hover .drop-icon{transform:scale(1.1) rotate(-5deg);}
.drop-zone h2{font-size:17px;font-weight:600;margin-bottom:6px;}
.drop-zone p{color:var(--gray-400);font-size:13px;}
.drop-btn{display:inline-block;margin-top:18px;padding:10px 24px;background:var(--orange);color:#fff;border-radius:var(--radius-sm);font-weight:600;font-size:13px;cursor:pointer;border:none;transition:background .15s,transform .1s;box-shadow:0 2px 6px rgba(232,80,10,.3);}
.drop-btn:hover{background:#c43f05;transform:translateY(-1px);}
#file-input{display:none;}
.drop-secure{margin-top:14px;font-size:11px;color:var(--gray-400);}
.loading{text-align:center;padding:48px;color:var(--gray-600);background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);}
.spinner{width:40px;height:40px;border:3px solid var(--gray-200);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 18px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;font-weight:600;margin-bottom:6px;}
.loading-sub{font-size:12px;color:var(--gray-400);margin-bottom:18px;}
.steps-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.3;transition:opacity .3s;}
.step.active{opacity:1;} .step.done{opacity:.65;}
.step-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--gray-200);display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .3s,border-color .3s;}
.step.active .step-dot{border-color:var(--orange);background:var(--orange-light);}
.step.done .step-dot{border-color:var(--green);background:var(--green-light);}
.step-label{font-size:10px;color:var(--gray-400);white-space:nowrap;}
.score-section{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:22px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow-sm);animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.score-circle-wrap{flex-shrink:0;position:relative;width:88px;height:88px;}
.score-svg{width:88px;height:88px;transform:rotate(-90deg);}
.score-track{fill:none;stroke:var(--gray-200);stroke-width:6;}
.score-arc{fill:none;stroke-width:6;stroke-linecap:round;}
.score-arc-ok{stroke:#22c55e;} .score-arc-warn{stroke:#f59e0b;} .score-arc-fail{stroke:#ef4444;}
.score-text-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;}
.score-num{font-size:24px;line-height:1;color:var(--gray-800);}
.score-max{font-size:10px;color:var(--gray-400);margin-top:1px;}
.score-info{flex:1;}
.score-verdict{font-size:16px;font-weight:700;margin-bottom:4px;}
.score-sub{font-size:13px;color:var(--gray-600);}
.score-meta{font-size:12px;color:var(--gray-400);margin-top:6px;}
.status-ok{color:var(--green);} .status-warn{color:var(--amber);} .status-fail{color:var(--red);} .status-info{color:var(--gray-400);}
.recheck-btn{padding:8px 16px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--gray-50);color:var(--gray-600);cursor:pointer;font-size:13px;font-weight:600;margin-left:auto;white-space:nowrap;transition:background .15s;}
.recheck-btn:hover{background:var(--gray-100);}
.preview-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;margin-bottom:20px;box-shadow:var(--shadow-sm);animation:fadeUp .4s ease .05s both;}
.preview-card-title{font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
.preview-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
@media(max-width:600px){.preview-cols{grid-template-columns:1fr;}}
.preview-wrap{background:var(--gray-100);border-radius:var(--radius-sm);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:120px;}
.preview-wrap img{max-width:100%;max-height:200px;display:block;}
.preview-label{font-size:11px;color:var(--gray-400);margin-top:5px;text-align:center;}
.palette-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.palette-chip{display:flex;flex-direction:column;align-items:center;gap:3px;}
.palette-chip-color{width:30px;height:30px;border-radius:5px;border:1px solid rgba(0,0,0,.08);}
.palette-chip-label{font-size:10px;color:var(--gray-600);font-family:monospace;}
.palette-chip-pct{font-size:9px;color:var(--gray-400);}
.dpi-meter{display:flex;flex-direction:column;gap:5px;}
.dpi-val{font-size:13px;font-weight:700;}
.dpi-bar-wrap{background:var(--gray-100);border-radius:4px;height:10px;overflow:hidden;}
.dpi-bar{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.dpi-bar-ok{background:linear-gradient(90deg,#22c55e,#4ade80);}
.dpi-bar-warn{background:linear-gradient(90deg,#f59e0b,#fcd34d);}
.dpi-bar-fail{background:linear-gradient(90deg,#ef4444,#f87171);}
.dpi-target{font-size:11px;color:var(--gray-400);}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.stat-card{flex:1;min-width:120px;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s;animation:fadeUp .4s ease both;}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card:nth-child(1){animation-delay:.05s;} .stat-card:nth-child(2){animation-delay:.10s;} .stat-card:nth-child(3){animation-delay:.15s;} .stat-card:nth-child(4){animation-delay:.20s;} .stat-card:nth-child(5){animation-delay:.25s;}
.stat-label{font-size:11px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.stat-value{font-size:17px;font-weight:700;color:var(--gray-800);}
.stat-sub{font-size:11px;color:var(--gray-400);margin-top:2px;}
.section{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm);animation:fadeUp .4s ease both;}
.section-header{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:background .12s;}
.section-header:hover{background:var(--gray-50);}
.section-header.open{border-bottom-color:var(--gray-200);}
.section-icon{font-size:16px;width:20px;text-align:center;}
.section-title{font-weight:600;font-size:14px;flex:1;}
.section-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.badge-ok{background:var(--green-light);color:var(--green);} .badge-warn{background:var(--amber-light);color:var(--amber);} .badge-fail{background:var(--red-light);color:var(--red);} .badge-info{background:#E9EAEC;color:#3D4350;}
.chevron{font-size:11px;color:var(--gray-400);transition:transform .22s cubic-bezier(.4,0,.2,1);display:inline-block;}
.chevron.open{transform:rotate(180deg);}
.section-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s cubic-bezier(.4,0,.2,1);}
.section-body.open{grid-template-rows:1fr;}
.section-body-inner{overflow:hidden;}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--gray-100);font-size:13px;transition:background .1s;position:relative;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:var(--gray-50);}
.check-icon{font-size:14px;margin-top:1px;flex-shrink:0;}
.check-label{font-weight:500;color:var(--gray-800);}
.check-detail{color:var(--gray-600);font-size:12px;margin-top:2px;line-height:1.5;}
.check-value{margin-left:auto;font-size:12px;font-weight:600;color:var(--gray-600);white-space:nowrap;padding-left:12px;}
.spot-tag{display:inline-block;background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;margin:2px 2px 0 0;}
.tip-box{margin:8px 16px 12px;background:var(--amber-light);border:1px solid #FCD34D;border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);font-weight:500;line-height:1.5;}
.tip-box.tip-fail{background:var(--red-light);border-color:#FCA5A5;color:var(--red);}
.report-bar{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-sm);margin-top:20px;animation:fadeUp .4s ease .4s both;}
.report-bar span{flex:1;font-size:13px;color:var(--gray-600);}
.btn-action{padding:8px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,transform .1s;border:none;white-space:nowrap;}
.btn-action:hover{transform:translateY(-1px);}
.btn-dark{background:var(--gray-700);color:#fff;}
.btn-dark:hover{background:var(--gray-800);}
.btn-gray{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);}
.btn-gray:hover{background:var(--gray-200);}
.history-panel{position:fixed;top:0;right:-340px;width:320px;height:100vh;background:#fff;border-left:1px solid var(--gray-200);z-index:500;box-shadow:-4px 0 24px rgba(0,0,0,.12);transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.history-panel.open{right:0;}
.hist-header{padding:18px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
.hist-header h3{font-size:14px;font-weight:700;}
.hist-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--gray-400);padding:0;line-height:1;}
.hist-list{flex:1;overflow-y:auto;padding:12px;}
.hist-empty{text-align:center;color:var(--gray-400);font-size:13px;padding:32px 16px;}
.hist-item{border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:background .12s;}
.hist-item:hover{background:var(--gray-50);}
.hist-item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.hist-item-meta{font-size:11px;color:var(--gray-400);display:flex;gap:8px;align-items:center;}
.hist-score{font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px;}
.hist-score-ok{background:var(--green-light);color:var(--green);} .hist-score-warn{background:var(--amber-light);color:var(--amber);} .hist-score-fail{background:var(--red-light);color:var(--red);}
.hist-footer{padding:12px 16px;border-top:1px solid var(--gray-200);}
.btn-clear{width:100%;padding:8px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);background:var(--gray-50);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;}
.hist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:499;opacity:0;pointer-events:none;transition:opacity .3s;}
.hist-overlay.open{opacity:1;pointer-events:auto;}
#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:600;pointer-events:none;}
.toast{background:var(--gray-800);color:#fff;padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow);animation:toastIn .25s ease both;pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:300px;}
.toast.toast-success{background:var(--green);} .toast.toast-warn{background:var(--amber);} .toast.toast-error{background:var(--red);}
.toast.toast-out{animation:toastOut .25s ease both;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateX(20px);}}
.api-badge{display:inline-block;background:var(--green-light);color:var(--green);border:1px solid #86EFAC;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;}
@media print{
  .header,.drop-zone,.profile-bar,.report-bar,.recheck-btn,#toast-container,.top-progress,.history-panel,.hist-overlay,.btn-hist{display:none!important;}
  .section-body{display:grid!important;grid-template-rows:1fr!important;}
  body{background:#fff;} .main{padding:0;max-width:100%;}
  .section{break-inside:avoid;}
}
@media(max-width:520px){
  .stats-row .stat-card{min-width:100px;} .score-section{flex-direction:column;align-items:flex-start;}
  .recheck-btn{margin-left:0;} .main{padding:16px 10px;}
  #toast-container{bottom:12px;right:12px;left:12px;} .toast{max-width:100%;}
  .history-panel{width:100%;}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="top-progress" aria-hidden="true"><div class="top-progress-bar" id="top-progress-bar"></div></div>
<div id="toast-container" role="status" aria-live="polite"></div>
<div class="hist-overlay" id="hist-overlay" onclick="closeHistory()"></div>
<aside class="history-panel" id="history-panel">
  <div class="hist-header"><h3>📋 Historique</h3><button class="hist-close" onclick="closeHistory()">×</button></div>
  <div class="hist-list" id="hist-list"></div>
  <div class="hist-footer"><button class="btn-clear" onclick="clearHistory()">🗑 Effacer tout</button></div>
</aside>
<header class="header">
  <div class="logo">
    <div class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 766 760" xmlns="http://www.w3.org/2000/svg" style="width:22px;height:22px;display:block;" fill="none" stroke="#fff" stroke-miterlimit="10" stroke-width="18">

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const profileConfig={
  'grand-format':{label:'Grand format',dpiMin:72,dpiRec:100,bleedMin:3,cutContour:false,mirror:false,white:false},
  'rigide':{label:'Support rigide',dpiMin:100,dpiRec:150,bleedMin:3,cutContour:false,mirror:false,white:false},
  'textile':{label:'Textile',dpiMin:72,dpiRec:100,bleedMin:5,cutContour:false,mirror:false,white:false},
  'decoupe':{label:'Decoupe forme',dpiMin:100,dpiRec:150,bleedMin:3,cutContour:true,mirror:false,white:false},
  'vitrophanie':{label:'Vitrophanie',dpiMin:100,dpiRec:150,bleedMin:3,cutContour:true,mirror:true,white:true},
};

(function(){try{const s=localStorage.getItem('lpf_profile');if(s&&profileConfig[s])document.getElementById('profile-select').value=s;}catch(e){}})();
document.getElementById('profile-select').addEventListener('change',function(){try{localStorage.setItem('lpf_profile',this.value);}catch(e){}});

let db=null;
function initDB(){return new Promise((res,rej)=>{const req=indexedDB.open('lpf_preflight',2);req.onupgradeneeded=e=>{const s=e.target.result;if(!s.objectStoreNames.contains('analyses'))s.createObjectStore('analyses',{keyPath:'id',autoIncrement:true});};req.onsuccess=e=>{db=e.target.result;res(db);};req.onerror=()=>rej(req.error);});}
function saveAnalysis(entry){if(!db)return;const tx=db.transaction('analyses','readwrite');const store=tx.objectStore('analyses');store.add(entry);store.getAll().onsuccess=e=>{const all=e.target.result;if(all.length>20){const tx2=db.transaction('analyses','readwrite');all.slice(0,all.length-20).forEach(r=>tx2.objectStore('analyses').delete(r.id));}};}
function loadHistory(cb){if(!db){cb([]);return;}db.transaction('analyses','readonly').objectStore('analyses').getAll().onsuccess=e=>cb(e.target.result.reverse());}
function clearHistoryDB(){if(!db)return;db.transaction('analyses','readwrite').objectStore('analyses').clear();}
initDB().then(()=>refreshHistCount()).catch(()=>{});
function refreshHistCount(){loadHistory(items=>{const el=document.getElementById('hist-count');if(el)el.textContent=items.length?'('+items.length+')':'';}); }

function openHistory(){
  loadHistory(items=>{
    const list=document.getElementById('hist-list');
    if(!items.length){list.innerHTML='<div class="hist-empty">Aucune analyse.</div>';return;}
    list.innerHTML=items.map(it=>{const cls=it.score>=80?'hist-score-ok':it.score>=55?'hist-score-warn':'hist-score-fail';
      return'<div class="hist-item" onclick="closeHistory()"><div class="hist-item-name">'+escHtml(it.fileName)+'</div><div class="hist-item-meta"><span class="hist-score '+cls+'">'+it.score+'/100</span><span>'+escHtml(it.profile)+'</span><span>'+escHtml(it.date)+'</span></div></div>';}).join('');
  });
  document.getElementById('history-panel').classList.add('open');
  document.getElementById('hist-overlay').classList.add('open');
}
function closeHistory(){document.getElementById('history-panel').classList.remove('open');document.getElementById('hist-overlay').classList.remove('open');}
function clearHistory(){clearHistoryDB();document.getElementById('hist-list').innerHTML='<div class="hist-empty">Historique efface.</div>';refreshHistCount();showToast('Historique efface.','success');}

function showToast(msg,type,dur){
  dur=dur||3500;
  const icons={success:'✅',warn:'⚠️',error:'❌'};
  const t=document.createElement('div');
  t.className='toast'+(type?' toast-'+type:'');
  t.innerHTML='<span>'+(icons[type]||'ℹ️')+'</span><span>'+msg+'</span>';
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function(){t.classList.add('toast-out');t.addEventListener('animationend',function(){t.remove();});},dur);
}

function setProgress(pct){document.getElementById('top-progress-bar').style.width=pct+'%';}
function clearProgress(){const b=document.getElementById('top-progress-bar');b.style.width='100%';setTimeout(function(){b.style.width='0%';},300);}
function setStep(n,sub){for(let i=0;i<5;i++){const el=document.getElementById('step-'+i);if(!el)continue;el.classList.remove('active','done');if(i<n)el.classList.add('done');else if(i===n)el.classList.add('active');}const s=document.getElementById('loading-sub');if(s&&sub)s.textContent=sub;}

const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',e=>{if(!dz.contains(e.relatedTarget))dz.classList.remove('drag-over');});
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f&&f.type==='application/pdf')analyzePDF(f);else showToast('Fichier PDF requis.','warn');});
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('file-input').click();}});
document.getElementById('file-input').addEventListener('change',e=>{if(e.target.files[0])analyzePDF(e.target.files[0]);});

function buildScoreCircle(score,scoreClass){
  const r=36,circ=2*Math.PI*r;
  const arcClass=scoreClass==='score-ok'?'score-arc-ok':scoreClass==='score-warn'?'score-arc-warn':'score-arc-fail';
  const id='sa'+Date.now();
  return{
    html:'<div class="score-circle-wrap"><svg class="score-svg" viewBox="0 0 88 88"><circle class="score-track" cx="44" cy="44" r="'+r+'"/><circle class="score-arc '+arcClass+'" id="'+id+'" cx="44" cy="44" r="'+r+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg><div class="score-text-wrap"><span class="score-num" id="sn'+id+'">0</span><span class="score-max">/100</span></div></div>',
    animate:function(){requestAnimationFrame(function(){const arc=document.getElementById(id);if(arc){arc.style.transition='stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)';arc.style.strokeDashoffset=circ*(1-score/100);}animCounter(document.getElementById('sn'+id),score,1000);});}
  };
}
function animCounter(el,target,dur){if(!el)return;const t0=performance.now();function u(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(target*e);if(p<1)requestAnimationFrame(u);else el.textContent=target;}requestAnimationFrame(u);}

async function renderPageToCanvas(page,scale){
  const vp=page.getViewport({scale});const canvas=document.createElement('canvas');
  canvas.width=vp.width;canvas.height=vp.height;
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  return canvas;
}

function extractPalette(canvas,n){
  n=n||6;const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  const step=Math.max(1,Math.floor(Math.sqrt(W*H/3000)));
  const pixels=[],data=ctx.getImageData(0,0,W,H).data;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){const i=(y*W+x)*4;if(data[i+3]<30)continue;pixels.push([data[i],data[i+1],data[i+2]]);}
  if(!pixels.length)return[];
  let centers=[];for(let k=0;k<n;k++)centers.push(pixels[Math.floor(Math.random()*pixels.length)].slice());
  for(let iter=0;iter<20;iter++){
    const clusters=Array.from({length:n},()=>[]);
    pixels.forEach(px=>{let best=0,bd=Infinity;for(let k=0;k<n;k++){const d=cdist(px,centers[k]);if(d<bd){bd=d;best=k;}}clusters[best].push(px);});
    for(let k=0;k<n;k++){if(!clusters[k].length)continue;centers[k]=[0,1,2].map(c=>Math.round(clusters[k].reduce((s,p)=>s+p[c],0)/clusters[k].length));}
  }
  const counts=new Array(n).fill(0);
  pixels.forEach(px=>{let best=0,bd=Infinity;for(let k=0;k<n;k++){const d=cdist(px,centers[k]);if(d<bd){bd=d;best=k;}}counts[best]++;});
  const total=pixels.length||1;
  return centers.map((c,i)=>({rgb:c,pct:Math.round(counts[i]/total*100),hex:rgbHex(c)})).filter(x=>x.pct>0).sort((a,b)=>b.pct-a.pct).slice(0,n);
}
function cdist(a,b){return Math.sqrt((a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2);}
function rgbHex(rgb){return'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');}

// ── ANALYSE PRINCIPALE ──
async function analyzePDF(file){
  document.getElementById('drop-zone').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('results').style.display='none';
  setProgress(5);setStep(0,'Lecture du fichier…');

  try{
    const profileKey=document.getElementById('profile-select').value;
    const prof=profileConfig[profileKey];
    const fileSizeMo=file.size/1024/1024;

    // ── STEP 1 : Lecture et analyse raw du PDF ──
    setStep(1,'Analyse du PDF…');setProgress(15);

    const buf=await file.arrayBuffer();

    // Analyse directe du binaire PDF — fiable, sans dépendance externe
    let pdfAnalysis=null;
    try{
      const rawBytes=new Uint8Array(buf.slice(0));
      const dec=new TextDecoder('iso-8859-1');
      const raw=dec.decode(rawBytes);

      // Spots (Separation / DeviceN)
      const spots=new Set();
      const EXCLUDE=new Set(['None','All','DeviceCMYK','DeviceRGB','DeviceGray','DeviceN']);
      let rm;
      const sepRx=/\/Separation\s*\/([A-Za-z0-9_\-+. ]+)/g;
      while((rm=sepRx.exec(raw))!==null){
        const n=rm[1].trim().replace(/[\s\/\[\]<>()]+.*$/,'');
        if(n&&n.length>1&&!EXCLUDE.has(n))spots.add(n);
      }
      const devnRx=/\/DeviceN\s*\[([^\]]{1,400})\]/g;
      while((rm=devnRx.exec(raw))!==null){
        (rm[1].match(/\/([A-Za-z0-9_\-+. ]+)/g)||[]).forEach(function(it){
          const n=it.slice(1).trim();
          if(n&&n.length>1&&!EXCLUDE.has(n))spots.add(n);
        });
      }

      // Overprint
      let hasOverprint=false;
      const opRx=/\/OP\s+true/g;
      while((rm=opRx.exec(raw))!==null)hasOverprint=true;

      // Colorimétrie
      const hasCMYK=/\/DeviceCMYK/.test(raw);
      const hasRGB=/\/DeviceRGB|sRGB/.test(raw);
      const colorMixed=hasCMYK&&hasRGB;

      // Boxes
      function parseBox(rx){const m=raw.match(rx);if(!m)return null;return m[1].trim().split(/\s+/).map(Number);}
      const bb=parseBox(/\/BleedBox\s*\[([^\]]+)\]/);
      const tb=parseBox(/\/TrimBox\s*\[([^\]]+)\]/);
      const mb=parseBox(/\/MediaBox\s*\[([^\]]+)\]/)||[0,0,0,0];
      let bleedMm=null;
      if(bb&&tb){
        bleedMm=Math.min((tb[0]-bb[0])/72*25.4,(tb[1]-bb[1])/72*25.4,(bb[2]-tb[2])/72*25.4,(bb[3]-tb[3])/72*25.4);
        bleedMm=Math.max(0,Math.round(bleedMm*10)/10);
      }
      const widthMm=Math.round((mb[2]-mb[0])/72*25.4*10)/10;
      const heightMm=Math.round((mb[3]-mb[1])/72*25.4*10)/10;

      // Métadonnées
      function meta(key){const rx=new RegExp('\/'+key+'\\(([^)]+)\\)');const m=raw.match(rx);return m?m[1]:'';}
      const creator=meta('Creator');
      const producer=meta('Producer');
      const pdfVersion=(raw.match(/%PDF-(\d+\.\d+)/)||['','?'])[1];
      const trapped=raw.includes('/Trapped/True')?'True':raw.includes('/Trapped/False')?'False':'Unknown';
      const pdfxStandard=(raw.match(/GTS_PDFXVersion\s*\(([^)]+)\)/)||raw.match(/pdfxid:GTS_PDFXVersion[^>]*>([^<]+)</)||[null,null])[1]||null;

      // Pages
      const pageMatches=raw.match(/\/Type\/Page[^s]/g)||[];
      const pages=Math.max(1,pageMatches.length);

      // Fonts
      const fontNames=new Set();
      const fontRx=/\/BaseFont\/([A-Za-z0-9_\-+]+)/g;
      while((rm=fontRx.exec(raw))!==null){
        const fn=rm[1].replace(/^[A-Z]{6}\+/,'');
        if(fn&&fn.length>1)fontNames.add(fn);
      }
      const fonts=[...fontNames].map(function(n){return{name:n,embedded:true};});

      // Images
      const imageCount=(raw.match(/\/Subtype\/Image/g)||[]).length;

      pdfAnalysis={
        pages:pages,
        widthMm:widthMm,
        heightMm:heightMm,
        spots:[...spots],
        hasOverprint:hasOverprint,
        hasCMYK:hasCMYK,
        hasRGB:hasRGB,
        colorMixed:colorMixed,
        bleedMm:bleedMm,
        hasTrimBox:tb!==null,
        hasBleedBox:bb!==null,
        fonts:fonts,
        imageCount:imageCount,
        pdfVersion:pdfVersion,
        creator:creator,
        producer:producer,
        trapped:trapped,
        pdfxStandard:pdfxStandard
      };
      console.log('Analyse raw OK:',JSON.stringify(pdfAnalysis));
    }catch(parseErr){
      console.error('Parse error:',parseErr);
    }

    setProgress(50);setStep(2,'Rendu apercu…');

    // ── STEP 2 : Rendu visuel PDF.js (apercu seulement) ──
    const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
    const pages=pdfAnalysis?pdfAnalysis.pages:pdf.numPages;
    const page1=await pdf.getPage(1);
    const mbox=page1.view;
    const wMm=pdfAnalysis?pdfAnalysis.widthMm:parseFloat(((mbox[2]-mbox[0])/72*25.4).toFixed(1));
    const hMm=pdfAnalysis?pdfAnalysis.heightMm:parseFloat(((mbox[3]-mbox[1])/72*25.4).toFixed(1));

    const maxPx=520;
    const previewScale=Math.min(maxPx/(mbox[2]-mbox[0]),maxPx/(mbox[3]-mbox[1]),2);
    const previewCanvas=await renderPageToCanvas(page1,previewScale);
    setProgress(70);setStep(3,'Palette…');

    const palette=extractPalette(previewCanvas,6);
    const previewDataURL=previewCanvas.toDataURL('image/jpeg',0.88);
    setProgress(82);setStep(4,'Construction du rapport…');

    // ── Donnees depuis API ou fallback ──
    const spots=pdfAnalysis?pdfAnalysis.spots:[];
    const hasOverprint=pdfAnalysis?pdfAnalysis.hasOverprint:false;
    const hasCMYK=pdfAnalysis?pdfAnalysis.hasCMYK:false;
    const hasRGB=pdfAnalysis?pdfAnalysis.hasRGB:false;
    const colorMixed=pdfAnalysis?pdfAnalysis.colorMixed:false;
    const bleedMm=pdfAnalysis?pdfAnalysis.bleedMm:null;
    const hasTrimBox=pdfAnalysis?pdfAnalysis.hasTrimBox:false;
    const hasBleedBox=pdfAnalysis?pdfAnalysis.hasBleedBox:false;
    const fonts=pdfAnalysis?pdfAnalysis.fonts:[];
    const imageCount=pdfAnalysis?pdfAnalysis.imageCount:0;
    const pdfVersion=pdfAnalysis?pdfAnalysis.pdfVersion:'?';
    const pdfCreator=pdfAnalysis?pdfAnalysis.creator:'';
    const pdfProducer=pdfAnalysis?pdfAnalysis.producer:'';
    const pdfxStandard=pdfAnalysis?pdfAnalysis.pdfxStandard:null;
    const trapped=pdfAnalysis?pdfAnalysis.trapped:null;
    const hasSpot=spots.length>0;
    const isLandscape=wMm>hMm,isSquare=Math.abs(wMm-hMm)<5;
    const hasLargeFormat=wMm>200||hMm>200;
    const multipage=pages>1;
    const fontsEmbedded=fonts.every(f=>f.embedded!==false);

    // Score
    let score=100,failCount=0,warnCount=0;
    if(colorMixed){score-=10;warnCount++;}
    if(bleedMm!==null&&bleedMm<prof.bleedMin){score-=8;warnCount++;}
    if(!hasTrimBox&&!hasLargeFormat){score-=5;warnCount++;}
    if(!fontsEmbedded){score-=5;warnCount++;}
    if(!versionOK(pdfVersion)){score-=5;warnCount++;}
    if(multipage){score-=5;warnCount++;}
    if(prof.cutContour&&!hasSpot){score-=15;failCount++;}
    if(prof.cutContour&&hasSpot){
      const hasCut=spots.some(n=>n.toLowerCase().includes('cut')||n.toLowerCase().includes('die'));
      if(!hasCut){score-=10;warnCount++;}
    }
    score=Math.max(0,score);

    let verdict,verdictClass,scoreClass;
    if(score>=80){verdict='Fichier probablement imprimable';verdictClass='status-ok';scoreClass='score-ok';}
    else if(score>=55){verdict='Points a verifier avant lancement';verdictClass='status-warn';scoreClass='score-warn';}
    else{verdict='Problemes bloquants detectes';verdictClass='status-fail';scoreClass='score-fail';}

    const now=new Date();
    const dateStr=now.toLocaleDateString('fr-FR')+' '+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    saveAnalysis({fileName:file.name,profile:prof.label,score,failCount,warnCount,date:dateStr});
    refreshHistCount();
    window._reportData={file,prof,score,failCount,warnCount,wMm,hMm,pages,colorMixed,hasCMYK,hasRGB,bleedMm,hasTrimBox,hasBleedBox,fonts,imageCount,pdfVersion,pdfCreator,pdfxStandard,spots,hasOverprint,hasSpot,profileKey,dateStr,fileSizeMo};

    // ── BUILD HTML ──
    const sc=buildScoreCircle(score,scoreClass);
    let html='';

    // Score header
    html+='<div class="score-section">'+sc.html+'<div class="score-info"><div class="score-verdict '+verdictClass+'">'+verdict+'</div><div class="score-sub">'+failCount+' bloquant(s) · '+warnCount+' avertissement(s)</div><div class="score-meta">📁 '+escHtml(file.name)+' · '+fileSizeMo.toFixed(2)+' Mo · '+pages+' page(s) · '+escHtml(prof.label)+' · '+dateStr+'</div></div><button class="recheck-btn" onclick="resetTool()">← Nouveau</button></div>';

    // Preview
    const palHtml=palette.map(c=>'<div class="palette-chip"><div class="palette-chip-color" style="background:'+c.hex+'"></div><div class="palette-chip-label">'+c.hex+'</div><div class="palette-chip-pct">'+c.pct+'%</div></div>').join('');
    const densiteMoM2=fileSizeMo/Math.max((wMm*hMm)/1e6,0.001);
    let dpiLabel,dpiStatus;
    if(densiteMoM2>80){dpiLabel='Densite tres elevee';dpiStatus='ok';}
    else if(densiteMoM2>20){dpiLabel='Densite correcte';dpiStatus='ok';}
    else if(densiteMoM2>5){dpiLabel='Densite faible';dpiStatus='warn';}
    else{dpiLabel=imageCount>0?'Densite tres faible':'Probablement vectoriel';dpiStatus=imageCount>0?'warn':'ok';}
    const dpiBarPct=Math.min(100,Math.round(Math.log10(Math.max(densiteMoM2,0.1)+1)/Math.log10(81)*100));

    html+='<div class="preview-card"><div class="preview-card-title">Apercu page 1 — '+wMm+' x '+hMm+' mm · '+(isLandscape?'Paysage':isSquare?'Carre':'Portrait')+'</div><div class="preview-cols"><div><div class="preview-wrap"><img src="'+previewDataURL+'" alt="Apercu page 1"></div><div class="preview-label">Page 1</div></div><div><div style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Palette dominante</div><div class="palette-row">'+palHtml+'</div><div style="margin-top:14px;font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Resolution (indicateur)</div><div class="dpi-meter"><div class="dpi-val status-'+dpiStatus+'">'+dpiLabel+'</div><div class="dpi-bar-wrap"><div class="dpi-bar dpi-bar-'+dpiStatus+'" id="dpi-bar-anim" style="width:0%"></div></div><div class="dpi-target">'+fileSizeMo.toFixed(1)+' Mo · '+densiteMoM2.toFixed(0)+' Mo/m2 · '+imageCount+' image(s)</div></div></div></div></div>';

    // Stats
    html+='<div class="stats-row"><div class="stat-card"><div class="stat-label">Format</div><div class="stat-value" style="font-size:14px">'+wMm+'x'+hMm+'</div><div class="stat-sub">mm</div></div><div class="stat-card"><div class="stat-label">Pages</div><div class="stat-value">'+pages+'</div><div class="stat-sub">'+(multipage?'⚠ Plusieurs':'Unique')+'</div></div><div class="stat-card"><div class="stat-label">Taille</div><div class="stat-value">'+fileSizeMo.toFixed(1)+'</div><div class="stat-sub">Mo</div></div><div class="stat-card"><div class="stat-label">Logiciel</div><div class="stat-value" style="font-size:12px">'+escHtml(pdfCreator||'—')+'</div><div class="stat-sub">'+escHtml(pdfVersion?'PDF '+pdfVersion:'')+'</div></div>'+(pdfxStandard?'<div class="stat-card"><div class="stat-label">Norme</div><div class="stat-value" style="font-size:13px">'+escHtml(pdfxStandard)+'</div><div class="stat-sub" style="color:var(--green)">✓ OK</div></div>':'')+'</div>';

    function sec(icon,title,status,body,tip){
      const bc=status==='ok'?'badge-ok':status==='warn'?'badge-warn':status==='fail'?'badge-fail':'badge-info';
      const bt=status==='ok'?'✓ OK':status==='warn'?'⚠ Verifier':status==='fail'?'✗ Bloquant':'ℹ Info';
      const id='s'+Math.random().toString(36).slice(2);
      const open=status==='fail'||status==='warn';
      return'<div class="section"><div class="section-header '+(open?'open':'')+'" onclick="toggleSection(\''+id+'\')" tabindex="0" aria-expanded="'+open+'"><span class="section-icon">'+icon+'</span><span class="section-title">'+escHtml(title)+'</span><span class="section-badge '+bc+'">'+bt+'</span><span class="chevron '+(open?'open':'')+'" aria-hidden="true">▼</span></div><div class="section-body '+(open?'open':'')+'" id="'+id+'"><div class="section-body-inner">'+body+(tip?'<div class="tip-box'+(status==='fail'?' tip-fail':'')+'" role="note">'+tip+'</div>':'')+'</div></div></div>';
    }
    function row(icon,label,detail,value,status,tip){
      const ta=tip?' data-tip="'+escHtml(tip)+'"':'';
      return'<div class="check-row"'+ta+'><span class="check-icon status-'+status+'">'+icon+'</span><div><div class="check-label">'+escHtml(label)+'</div>'+(detail?'<div class="check-detail">'+escHtml(detail)+'</div>':'')+'</div><span class="check-value status-'+status+'">'+escHtml(value)+'</span></div>';
    }

    // 1. COLORIMETRIE
    let detectedMode=hasCMYK&&!hasRGB?'CMJN':hasRGB&&!hasCMYK?'RVB':colorMixed?'CMJN+RVB mixte':'Non detecte';
    let cB=row(colorMixed?'⚠':'✓','Coherence colorimetrique',
      colorMixed?'Melange CMJN+RVB detecte — risque de decalage entre BAT client et prod.':hasCMYK?'CMJN homogene — coherence garantie.':hasRGB?'RVB homogene — OK.':'Non detecte.',
      detectedMode,colorMixed?'warn':'ok');
    html+=sec('🎨','Coherence colorimetrique',colorMixed?'warn':'ok',cB,colorMixed?'→ Uniformiser la colorimetrie (tout CMJN ou tout RVB) avant export.':null);

    // 2. TONS DIRECTS
    if(hasSpot){
      const hasCut=spots.some(n=>n.toLowerCase().includes('cut')||n.toLowerCase().includes('die'));
      const hasWhite=spots.some(n=>n.toLowerCase()==='white'||n.toLowerCase().includes('blanc'));
      const spotTagsHtml=spots.map(n=>'<span class="spot-tag">'+escHtml(n)+'</span>').join(' ');
      let spB='<div class="check-row"><span class="check-icon status-info">🎨</span><div><div class="check-label">Tons directs identifies<span class="api-badge">raw</span></div><div class="check-detail">'+spotTagsHtml+'</div></div><span class="check-value status-info">'+spots.length+' ton(s)</span></div>';
      spB+=row(hasOverprint?'✓':'⚠','Surimpression (overprint)',
        hasOverprint?'Overprint detecte — les tons directs sont configures en surimpression.':'Aucun overprint detecte. Verifier dans Acrobat Pro → Apercu de la sortie.',
        hasOverprint?'Detecte':'Non detecte',hasOverprint?'ok':'warn');
      if(prof.cutContour)spB+=row(hasCut?'✓':'✗','Trace CutContour',hasCut?'CutContour detecte.':'CutContour manquant — obligatoire pour ce profil.',hasCut?'Detecte':'MANQUANT',hasCut?'ok':'fail');
      if(prof.white)spB+=row(hasWhite?'✓':'⚠','Blanc de soutien',hasWhite?'Blanc detecte.':'Blanc non detecte — verifier si necessaire.','',hasWhite?'ok':'warn');
      spB+='<div class="check-row" style="flex-direction:column;align-items:flex-start;gap:8px;"><div style="font-size:12px;font-weight:600;color:var(--gray-600);">Apercu page 1</div><img src="'+previewDataURL+'" style="max-height:150px;border-radius:4px;border:1px solid var(--gray-200);" alt="Apercu"><div style="font-size:11px;color:var(--gray-400);">PDF.js convertit les tons directs en RVB pour le rendu. La surimpression est detectable via Acrobat Pro → Apercu de la sortie.</div></div>';
      const spotStatus=!hasCut&&prof.cutContour?'fail':!hasOverprint?'warn':'ok';
      html+=sec('🎭','Tons directs & surimpression',spotStatus,spB,
        spotStatus==='fail'?'→ CutContour obligatoire — ajouter Magenta 100% surimprime, calque dedie.':
        !hasOverprint?'→ Verifier overprint dans Acrobat Pro → Apercu de la sortie → Simuler la surimpression.':'→ Confirmer visuellement dans Acrobat Pro → Apercu de la sortie.');
    } else if(prof.cutContour){
      const cuB=row('✗','Trace CutContour manquant','Aucune couleur directe detectee — trace absent.','MANQUANT','fail');
      html+=sec('✂️','Decoupe & CutContour','fail',cuB,'→ Ajouter CutContour en Magenta 100% surimprime, calque dedie.');
    }

    // 3. FOND PERDU
    let bB='',bleedStatus='info',bleedTip=null;
    if(bleedMm!==null){
      const ok=bleedMm>=prof.bleedMin;
      bleedStatus=ok?'ok':'warn';
      bB+=row(ok?'✓':'⚠','Fond perdu detecte<span class="api-badge" style="margin-left:4px">raw</span>',
        'Fond perdu mesure : '+bleedMm.toFixed(1)+' mm (TrimBox vs BleedBox). Requis : '+prof.bleedMin+' mm.',
        bleedMm.toFixed(1)+' mm',ok?'ok':'warn');
      if(!ok)bleedTip='→ Fond perdu insuffisant : '+bleedMm.toFixed(1)+' mm detecte, '+prof.bleedMin+' mm requis.';
    } else if(hasLargeFormat){
      bB+=row('ℹ','Grand format — fond perdu inclus','Format '+wMm+'x'+hMm+' mm. En grand format, le fond perdu est generalement inclus dans les dimensions. Verifier que les cotes incluent le debord de '+prof.bleedMin+' mm.',prof.bleedMin+' mm a verifier','info');
    } else {
      bleedStatus='warn';
      bB+=row('⚠','Fond perdu non detecte','Aucune BleedBox/TrimBox detectee. '+prof.bleedMin+' mm minimum requis.',prof.bleedMin+' mm requis','warn');
      bleedTip='→ Ajouter '+prof.bleedMin+' mm de fond perdu dans le fichier source.';
    }
    bB+=row('ℹ','Dimensions','MediaBox : '+wMm+' x '+hMm+' mm'+(hasTrimBox?' | TrimBox presente':' | Pas de TrimBox')+(hasBleedBox?' | BleedBox presente':' | Pas de BleedBox'),'','info');
    html+=sec('📐','Fond perdu & dimensions',bleedStatus,bB,bleedTip);

    // 4. POLICES
    let fB='',fontStatus='info';
    if(fonts.length>0){
      const tagsHtml=fonts.slice(0,8).map(f=>'<span class="spot-tag">'+escHtml(f.name)+'</span>').join(' ')+(fonts.length>8?'<span class="spot-tag">+'+(fonts.length-8)+'</span>':'');
      fB+='<div class="check-row"><span class="check-icon status-info">🔤</span><div><div class="check-label">Polices detectees<span class="api-badge" style="margin-left:4px">raw</span></div><div class="check-detail">'+tagsHtml+'</div></div><span class="check-value status-info">'+fonts.length+'</span></div>';
      if(!fontsEmbedded){fontStatus='warn';fB+=row('⚠','Polices non incorporees','Une ou plusieurs polices ne sont pas incorporees dans le PDF.','A verifier','warn');}
      else fB+=row('✓','Polices incorporees','Toutes les polices detectees sont incorporees.','OK','ok');
    } else {
      fB+=row('✓','Polices','Aucune police raster — contenu probablement en traces vectoriels.','Traces','ok');
    }
    fB+=row('ℹ','Verification','Acrobat Pro → Fichier → Proprietes → Polices — toutes Incorporees.','Acrobat Pro','info');
    html+=sec('🔤','Polices & typographie',fontStatus,fB,fontStatus==='warn'?'→ Acrobat Pro → Proprietes → Polices → incorporer ou convertir en traces.':null);

    // 5. MIROIR (vitrophanie)
    if(prof.mirror){
      const mB=row('⚠','Miroir & sens de lecture','Confirmer face de pose et sens de lecture AVANT de figer miroir et blanc de soutien.','A confirmer','warn');
      html+=sec('🪞','Vitrophanie — miroir','warn',mB,'→ Confirmer avec le poseur (B8) avant lancement.');
    }

    // 6. MULTI-PAGES
    if(multipage){
      html+=sec('📑','Nombre de pages','warn',row('⚠',pages+' pages','LPF travaille page par page. Verifier si intentionnel.',pages+' pages','warn'),'→ Exporter en page unique si une seule page attendue.');
    }

    // 7. METADONNEES
    let mB=row('ℹ','Logiciel',pdfCreator||'Non detecte',pdfCreator||'—','info');
    mB+=row(versionOK(pdfVersion)?'✓':'⚠','Version PDF','PDF '+pdfVersion,'PDF '+pdfVersion,versionOK(pdfVersion)?'ok':'warn');
    if(pdfxStandard)mB+=row('✓','Norme PDF',pdfxStandard,pdfxStandard,'ok');
    if(trapped&&trapped!=='Unknown')mB+=row('ℹ','Trapping',trapped,'','info');
    html+=sec('📋','Metadonnees',pdfxStandard?'ok':'info',mB);

    // REPORT BAR
    html+='<div class="report-bar"><span>📋 '+dateStr+' — '+escHtml(file.name)+' — '+escHtml(prof.label)+'</span><button class="btn-action btn-gray" onclick="copyReport()">📋 Copier</button><button class="btn-action btn-gray" onclick="window.print()">🖨 Imprimer</button><button class="btn-action btn-dark" onclick="exportPDF()">⬇️ Exporter PDF</button></div>';

    window._reportSummary=buildReportText(file,prof,score,failCount,warnCount,wMm,hMm,pages,detectedMode,bleedMm,pdfVersion,pdfCreator,profileKey,dateStr,spots,hasOverprint,fonts);

    setProgress(95);
    document.getElementById('loading').style.display='none';
    const res=document.getElementById('results');
    res.innerHTML=html;res.style.display='block';
    clearProgress();
    setTimeout(()=>sc.animate(),100);
    setTimeout(()=>{const b=document.getElementById('dpi-bar-anim');if(b)b.style.width=dpiBarPct+'%';},200);
    if(score>=80)showToast('Fichier probablement imprimable','success');
    else if(score>=55)showToast(warnCount+' point(s) a verifier','warn');
    else showToast(failCount+' probleme(s) bloquant(s)','error');

  }catch(err){
    document.getElementById('loading').style.display='none';
    document.getElementById('drop-zone').style.display='block';
    clearProgress();
    showToast('Erreur : '+err.message,'error',6000);
    console.error(err);
  }
}

function versionOK(v){return v&&parseFloat(v)>=1.3;}

function exportPDF(){
  const d=window._reportData;if(!d){showToast('Aucun rapport a exporter.','warn');return;}
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const W=210,M=18;let y=0;
    doc.setFillColor(232,80,10);doc.rect(0,0,W,16,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text('LPF Preflight - Rapport de controle',M,11);
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('Le Poulpe Francais - B4 PAO - Analyse Claude',W-M,11,{align:'right'});
    y=26;doc.setTextColor(30,30,30);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text('Fichier : '+d.file.name,M,y);y+=6;
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(80,80,80);
    doc.text('Profil : '+d.prof.label+' | '+d.wMm+'x'+d.hMm+' mm | '+d.pages+' page(s) | '+d.dateStr,M,y);y+=10;
    const sc=d.score>=80?[45,125,70]:d.score>=55?[180,83,9]:[185,28,28];
    doc.setFillColor(...sc);doc.roundedRect(M,y,45,18,3,3,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont('helvetica','bold');doc.text(String(d.score)+'/100',M+22,y+13,{align:'center'});
    doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(30,30,30);
    doc.text((d.score>=80?'Probablement imprimable':d.score>=55?'Points a verifier':'Problemes bloquants'),M+52,y+7);
    doc.text(d.failCount+' bloquant(s) - '+d.warnCount+' avertissement(s)',M+52,y+13);y+=26;
    const rows=[
      ['Colorimetrie',d.colorMixed?'CMJN+RVB mixte':(d.hasCMYK?'CMJN':'RVB'),d.colorMixed?'Melange':'OK'],
      ['Fond perdu',d.bleedMm!==null?d.bleedMm.toFixed(1)+' mm':'Non detecte',d.bleedMm!==null?(d.bleedMm>=d.prof.bleedMin?'OK':'Insuffisant'):'Verifier'],
      ['Tons directs',d.spots.length?d.spots.slice(0,3).join(', '):'Aucun',d.hasOverprint?'Overprint OK':'Verifier overprint'],
      ['Polices',d.fonts.length?d.fonts.length+' detec.':' Traces vectoriels',d.fonts.every(f=>f.embedded!==false)?'OK':'Verifier'],
      ['Version PDF','PDF '+d.pdfVersion,versionOK(d.pdfVersion)?'OK':'Verifier'],
    ];
    if(d.prof.cutContour)rows.push(['CutContour',d.hasSpot?'Detecte':'MANQUANT',d.hasSpot?'OK':'BLOQUANT']);
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.text('Resultats',M,y);y+=5;
    const cw=[50,80,48];
    doc.setFillColor(245,245,245);doc.rect(M,y,178,7,'F');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(60,60,60);
    let cx=M;['Controle','Detail','Statut'].forEach((h,i)=>{doc.text(h,cx+2,y+5);cx+=cw[i];});y+=7;
    rows.forEach((r,ri)=>{
      if(y>272){doc.addPage();y=18;}
      if(ri%2===0){doc.setFillColor(252,252,252);doc.rect(M,y,178,7,'F');}
      doc.setFont('helvetica','normal');doc.setFontSize(8);
      const sc2=r[2]==='BLOQUANT'?[185,28,28]:r[2].includes('verifier')||r[2].includes('Verifier')||r[2]==='Insuffisant'?[180,83,9]:r[2]==='OK'||r[2].includes('OK')?[45,125,70]:[80,80,80];
      cx=M;[r[0],r[1]].forEach((cell,i)=>{doc.setTextColor(40,40,40);doc.text(cell,cx+2,y+5,{maxWidth:cw[i]-4});cx+=cw[i];});
      doc.setTextColor(...sc2);doc.setFont('helvetica','bold');doc.text(r[2],cx+2,y+5);y+=7;
    });
    doc.setFillColor(245,245,245);doc.rect(0,283,W,14,'F');
    doc.setFontSize(7);doc.setTextColor(120,120,120);
    doc.text('LPF Preflight - Analyse Claude - '+d.dateStr,M,289);
    doc.text('[CallmeSally : matiere, quantite, reference dossier LPF]',M,294);
    doc.save('LPF_Preflight_'+d.file.name.replace(/\.pdf$/i,'')+'_'+d.dateStr.replace(/[:\/ ]/g,'-')+'.pdf');
    showToast('PDF exporte !','success');
  }catch(e){showToast('Erreur export : '+e.message,'error');console.error(e);}
}

function buildReportText(file,prof,score,failCount,warnCount,wMm,hMm,pages,colorMode,bleedMm,pdfVersion,creator,profileKey,dateStr,spots,hasOverprint,fonts){
  return 'RAPPORT PREFLIGHT LPF (analyse Claude)\n========================================\nFichier  : '+file.name+'\nProfil   : '+prof.label+'\nDate     : '+dateStr+'\nScore    : '+score+'/100 ('+failCount+' bloquant(s), '+warnCount+' avertissement(s))\n\nDIMENSIONS  : '+wMm+' x '+hMm+' mm\nCOULEURS    : '+colorMode+'\nFOND PERDU  : '+(bleedMm!==null?bleedMm.toFixed(1)+' mm detecte':'Non detecte')+'\nTONS DIR.   : '+(spots.length?spots.join(', '):'Aucun')+(hasOverprint?' (overprint OK)':' (verifier overprint)')+'\nPOLICES     : '+fonts.length+' detectee(s)\nVERSION PDF : '+pdfVersion+'\nLOGICIEL    : '+(creator||'Non detecte')+'\n\n[CallmeSally : matiere, quantite, reference dossier LPF]';
}

function toggleSection(id){
  const body=document.getElementById(id);
  const header=body.previousElementSibling;
  const chevron=header.querySelector('.chevron');
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);header.classList.toggle('open',!isOpen);
  header.setAttribute('aria-expanded',!isOpen);chevron.classList.toggle('open',!isOpen);
}
function resetTool(){document.getElementById('results').style.display='none';document.getElementById('drop-zone').style.display='block';document.getElementById('file-input').value='';window._reportSummary=null;window._reportData=null;}
function copyReport(){if(window._reportSummary)navigator.clipboard.writeText(window._reportSummary).then(()=>showToast('Copie !','success')).catch(()=>showToast('Impossible.','warn'));}
function escHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
