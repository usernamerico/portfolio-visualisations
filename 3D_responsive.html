    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #020208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            perspective: 1000px;
            cursor: move;
            touch-action: none;
        }

        .viewport-3d {
            /* Taille dynamique : 90vmin pour s'adapter à tous les écrans */
            width: min(600px, 90vmin);
            height: min(600px, 90vmin);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .holo-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            pointer-events: none;
            mix-blend-mode: screen;
            will-change: transform;
            transform: translateZ(var(--z)) scale(var(--scale));
        }

        .st0 {
            fill: none !important;
            stroke-miterlimit: 10;
            stroke: var(--stroke-color) !important;
            stroke-width: var(--stroke-width) !important;
            opacity: var(--opacity);
            filter: drop-shadow(0px 0px var(--glow-radius) var(--glow-color));
            transition: stroke 0.3s ease;
        }
    </style>
</head>

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function interpolateColor(color1, color2, factor) {
            const r1 = parseInt(color1.substring(1,3), 16), g1 = parseInt(color1.substring(3,5), 16), b1 = parseInt(color1.substring(5,7), 16);
            const r2 = parseInt(color2.substring(1,3), 16), g2 = parseInt(color2.substring(3,5), 16), b2 = parseInt(color2.substring(5,7), 16);
            const r = Math.round(lerp(r1, r2, factor)).toString(16).padStart(2, '0');
            const g = Math.round(lerp(g1, g2, factor)).toString(16).padStart(2, '0');
            const b = Math.round(lerp(b1, b2, factor)).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        for (let i = 0; i < TOTAL_LAYERS; i++) {
            const factor = i / (TOTAL_LAYERS - 1);
            const layer = masterSVG.cloneNode(true);
            layer.removeAttribute('id');
            layer.classList.add('holo-layer');
            layer.style.display = 'block';

            const z = lerp(-120, 60, factor);
            const scale = lerp(0.90, 1.05, factor);
            const strokeColor = interpolateColor("#12005e", "#00f3ff", factor);
            const glowColor = interpolateColor("#3a0099", "#00aaff", factor);
            const strokeWidth = lerp(0.8, 2.2, factor);
            const opacity = lerp(0.4, 1.0, factor);
            const glowRadius = lerp(1, 14, factor);

            layer.style.setProperty('--z', `${z}px`);
            layer.style.setProperty('--scale', scale.toFixed(3));
            layer.style.setProperty('--stroke-width', `${strokeWidth.toFixed(2)}px`);
            layer.style.setProperty('--opacity', opacity.toFixed(2));
            layer.style.setProperty('--stroke-color', strokeColor);
            layer.style.setProperty('--glow-color', glowColor);
            layer.style.setProperty('--glow-radius', `${glowRadius.toFixed(1)}px`);

            container.appendChild(layer);
        }

        // --- INTERACTION SOURIS ---
        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            const rotY = ((e.clientX - centerX) / window.innerWidth) * 40;
            const rotX = -((e.clientY - centerY) / window.innerHeight) * 40;
            container.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        });

        // --- INTERACTION TACTILE (gyroscope ou glisser) ---
        let lastTouch = null;
        let currentRotX = 0;
        let currentRotY = 0;

        document.addEventListener('touchstart', (e) => {
            lastTouch = e.touches[0];
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!lastTouch) return;
            const touch = e.touches[0];
            const dx = touch.clientX - lastTouch.clientX;
            const dy = touch.clientY - lastTouch.clientY;
            currentRotY += dx * 0.3;
            currentRotX -= dy * 0.3;
            currentRotY = Math.max(-40, Math.min(40, currentRotY));
            currentRotX = Math.max(-40, Math.min(40, currentRotX));
            container.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
            lastTouch = touch;
        }, { passive: false });

        document.addEventListener('touchend', () => { lastTouch = null; });

        // --- GYROSCOPE (mobile) ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma === null) return;
                const rotY = Math.max(-40, Math.min(40, e.gamma));
                const rotX = Math.max(-40, Math.min(40, (e.beta - 45) * 0.8));
                container.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            });
        }

        window.addEventListener('resize', () => {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        });
    </script>
</body>
</html>
