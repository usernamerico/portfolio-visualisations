<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieuvre — Projection Perspective Pure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020208; overflow: hidden; width: 100vw; height: 100vh; cursor: grab; }
        body:active { cursor: grabbing; }
        canvas { display: block; }
        #info {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: rgba(0,200,255,0.3);
            font-family: monospace; font-size: 11px; letter-spacing: 3px;
            pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DRAG · SCROLL</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── 1. ÉCHANTILLONNAGE DU PATH SVG ───────────────────────────────────────────
function samplePath(d, n) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    Object.assign(svg.style, {position:'absolute',visibility:'hidden',width:'766px',height:'760px'});
    svg.setAttribute('viewBox','0 0 766 760');
    document.body.appendChild(svg);
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
    const L = path.getTotalLength();
    const pts = [];
    for (let i = 0; i < n; i++) {
        const p = path.getPointAtLength((i / n) * L);
        pts.push({ x: p.x - 383, y: -(p.y - 380) });
    }
    document.body.removeChild(svg);
    return pts;
}

const D = `M440.4,578.7c11.2-6,24.5-2.7,33.3,4.8,4.7,4,6.6,9,7.6,15l5.5.2c0-8-2.3-15.7-8.4-21.8-11.9-11.9-31-16.1-46.4-8.2-17,8.7-26.9,26.4-27.8,45.4-.3,7.3,0,15.5,2.2,22.4,14.5,45.9,56.2,100.3,108.1,93.4,19.3-2.6,36.6-11.8,49.5-26.3,20.5-23.1,19.5-56.8,10.2-85.7-7.5-23.4-19.6-44.2-35.2-63.2-12.1-14.8-25-28-39.2-40.7l-41.8-37.3c-15.6-15.3-28.1-32.4-37.6-53.6,32.5,12.9,66,19,101,17.8,37.4-1.3,71.2-8.6,107.9-7.8,16.6.3,31.2,6.2,43.7,16.8,15.6,13.2,23.5,31.7,21.5,52.3-1.3,13.6-4.6,26.4-10.2,38.9-15,33.8-58.8,41.1-90,24.6-7-3.7-13.5-8.8-17.6-15.5-8.8-14.3-10.3-32-5.4-47.7,1.8-5.7,5.1-9.9,10.6-12.2,8.2-3.4,18-3.2,25.5,1.9s8.8,11.2,10.6,18.5l5.5-.7c-1-9.4-3.4-17.6-9.9-24.1-7.9-7.9-19.1-9.7-30-8.6-21.5,2.2-29.3,20.3-32.4,40.7-4.1,27.3,7.2,53.1,30.1,68.7,19.2,13.1,41.9,18,65.2,16.2,24.8-1.9,46.5-13.5,62-32.8,10.2-12.7,16.2-26.7,21.5-42,13.3-38.6,5.3-80.6-22.9-110.3-21.2-22.2-49.3-34.8-80.3-35-13.3,0-25.7,1.1-38.8,2.5l-52.8,5.9c-15,1.7-29.6,1.7-44.2.1,27.2-8.2,47.9-20.6,60.1-46.1s12-27.6,17.4-42l17.7-46.7c6.1-16.2,20.6-42.5,36.9-46.8,30-7.9,65.1,4.4,77.5,34.2,13,31.2,6.9,75.8-26.5,84.9s-24.3,5.1-36.7,3.7c-15.2-1.8-29.1-11.2-33.4-26.1-5.2-18.3,5.6-46.9,26.2-47.1l.5-5.3c-21.3-2.8-36.4,24.8-36.6,44.2s16.4,40.5,37.8,45.5c12.4,2.9,24.1,2.3,36.7,1.2,22.1-2,39.9-14.5,49.5-34.5,7.3-15.2,9-31.4,8.1-48.3-2.3-44.6-37.4-79.4-82-81.9-13.1-.7-25.6-1.2-37.9,4-22.9,9.8-38.2,32.7-49.7,54.7-15.3,29.3-25.2,58-41.8,87.8s-34.5,20.6-55.5,19.8c16.1-20.9,31.7-48.3,29.4-73.5-1.3-14.8-4.5-29-9.3-43l-14.7-42.8c-6.3-18.5-12.5-36.3-16.7-55.4-4.6-21.1,1.9-37.9,15.5-54.2,17.9-21.4,46-29.8,72.7-21.4s24.3,10.5,34.2,19.2c15.2,13.4,18.8,33.5,9.6,51.3-7.2,14-20.5,21.2-36.2,19.9-13.4-1.1-23-10-23.9-23.8-.3-4.6.6-9.9,3.7-13s8-4.7,13.8-4.5l1.2-5.2c-11.9-2.5-22.8,3.5-25.6,15.4-3.1,13.5,1.7,29.2,14.3,36.4,16.1,9.3,37.6,7.7,52.5-3.8,19.5-15.1,25.9-42.2,17.1-64.8-4.2-10.7-11.1-19-19.4-26.6-12.4-11.3-27.1-18.3-43.2-23.1-19.2-5.7-38.7-5-57.5,2.9-29.1,12.4-52,37.7-59.4,68.8-6.4,26.6,9.1,73.6,18.1,102.2,6,19.2,11.4,37.7,14.7,57.5,1.3,7.9,1.2,15.4-1.8,22.8s-10.2,19.1-17.8,27.5c1.7-13.3,2.8-25,1.2-37.8-3.7-29.6-22-54.7-48.9-67.7-28.8,14.1-47.1,41.6-49.4,73.2s.5,20.7,1.6,32.2c-13.5-16.4-23-30.1-19.4-50.8,3.4-19.2,8.5-37.2,14.3-55.9,9.1-28.9,24.8-76.6,18.3-103.4-11.2-46.2-58.9-82.7-106-74s-63.7,24.5-74.3,54.5c-9.9,28,4.9,64.4,36.6,70.9,12.6,2.6,26.1,1.5,36.7-6.6s15.5-25.1,10.2-38.4c-3.9-9.7-13.7-13.3-23.9-11.7l.6,5.4c5.8,0,10.7,1,14,4.5,3.4,3.5,4.1,9.1,3.8,13.8-1.1,13.7-11,22.2-24.2,23.2s-28.5-5.9-35.7-19.6c-9.2-17.5-6.3-37.5,8.7-51s22.6-16.2,36.1-20.2c38.6-11.3,75.8,12.5,86.9,49.8,2.7,9.2,1.8,18.7-.3,28-9.9,43.8-28.8,80-38.5,125.4-7.2,33.9,7.1,60.5,27.8,87.7-24.2.2-45.7-.7-57.6-23.2-6.9-13.1-13-25.8-18.9-39.5s-15.2-34.7-24.5-51.6c-11.2-20.5-26.5-40.7-48.4-49-11.8-4.4-23.6-3.9-35.9-3.1-45.3,2.7-80.3,38.5-81.8,83.9-.5,16.7,1.3,32.6,8.8,47.4,9.8,19.4,27.2,31.3,48.7,33.4s24.9,1.9,37.5-1.2c21.1-5.2,37.4-23.1,37.2-45.4-.2-19.4-14.9-46.6-36.2-44.2-.1,1.1,0,3.9.3,5.3,20.8.4,31.6,29.8,25.7,48.1-4.7,14.5-18.4,23.6-33.3,25.1-13.2,1.4-26.2-.5-38.7-4.5-30.5-9.8-35.9-50.8-25.6-80.4s46.9-45.9,78-38.1c8.7,2.1,15.5,8.3,20.6,15.4,7.9,11.1,14.2,22.8,19,35.6l16.5,44c6.5,17.3,12.7,34.1,22.2,50,7.8,13,20.1,22.2,33.5,28.8s14.1,5.5,21.2,8.2c-15.3,1.5-29.5,1.4-44.4-.2l-53.5-6c-37.3-4.2-66.3-5-98.4,16.1-42.3,27.9-59.2,79.6-42.3,127.3,5.7,16.2,12.2,31.3,23.8,44.4,14.6,16.5,33.4,26.9,55.5,29.4,21.8,2.4,43.3-.9,62.4-11.6s29.2-23.2,34.6-41.5c6.9-23.3,1.2-59.5-18.2-68.7-10.9-5.1-24.1-5.2-34.8,0-11.1,5.5-16.1,16.9-16.9,29.2l5.4.5c1.8-6.6,3.6-12.6,8.8-16.9,9.2-7.6,23.9-7.7,32.9.5s5.2,8.7,6.2,13.3c3.2,15,1.1,30.7-7.2,43.6s-12.1,12.4-20,16.1c-16.6,7.9-35.4,9.1-52.9,3.8-17.7-5.3-30.6-18.3-36.7-35.6-9-25.6-13.5-53.3,4.2-75.3,9.6-11.9,22.4-21,37.4-24.8,20.5-5.1,54.8-.7,78,1.9,54,6,93.4,6.8,146.6-13.9-9.8,22.8-24,41.5-41.5,57.3l-31.1,27.6c-34.9,30.9-66.1,64.4-80.8,109.3-12,36.4-9.5,75.1,23.2,98.1,18.1,12.8,40.6,18.6,62.4,12.8,17.2-4.6,31.6-14.5,44-27.2,15.8-16.2,26.7-35.5,35.3-56.3s4.9-59.6-20.6-74.9c-14.8-8.9-34.2-5.9-46.8,5.3-7,6.2-10.5,14-10,23.5l5.3-.2c.9-5.7,2.4-10,6.4-13.9,9.1-8.9,24.3-12.2,35.7-5.2,10.3,6.3,16.9,18.6,17,30.7s-.7,13.8-3,19.7c-10,24.7-29.2,47.9-52,62-18.1,11.2-41.7,8.2-55.8-7.9-7-8-9.9-18.4-8.2-28.9,2.6-16,8.7-30.4,17.6-43.9,9.3-14,20-26.3,32.4-37.9l59-55.1c21.5-20.1,37.4-43.6,49.3-71.6,12.2,30.5,31.3,55.2,54.9,77.2l59,55c21,21.9,40.8,47.8,44.3,78.4s-3.3,22.6-11.9,30.3c-16.2,14.3-38.6,14.4-56.3,1.9-21.4-15.1-38.4-35.9-48.3-60.5-2.2-5.6-2.7-12.6-2.7-18.7,0-12.5,6.9-25.3,18.3-31.4Z`;

// ── 2. CONSTRUCTION DES VERTICES 3D (extrusion) ──────────────────────────────
const raw = samplePath(D, 500);

// Normaliser → [-1, 1]
let maxR = 0;
raw.forEach(p => { maxR = Math.max(maxR, Math.hypot(p.x, p.y)); });
const sc = 1.0 / maxR;
const profile = raw.map(p => ({ x: p.x * sc, y: p.y * sc }));
const N = profile.length;

// Profondeur de l'extrusion + tranches intermédiaires
const DEPTH  = 0.6;   // en unités normalisées
const SLICES = 12;    // tranches Z

// Construire toutes les tranches de vertices
// verts[s][i] = { x, y, z }  pour la tranche s, point i
const verts = [];
for (let s = 0; s <= SLICES; s++) {
    const z = -DEPTH/2 + (s / SLICES) * DEPTH;
    verts.push(profile.map(p => ({ x: p.x, y: p.y, z })));
}

// Arêtes à tracer : tableau de paires d'indices [sliceA, ptA, sliceB, ptB]
// On stocke directement les paires de sommets pour perf
const edges = [];

// Contours avant + arrière + toutes les tranches intermédiaires
for (let s = 0; s <= SLICES; s++) {
    // On ne trace pas toutes les tranches — seulement face, back, et quelques nervures
    if (s !== 0 && s !== SLICES && s % 2 !== 0) continue;
    for (let i = 0; i < N; i++) {
        edges.push([verts[s][i], verts[s][(i+1) % N]]);
    }
}

// Arêtes latérales (avant → arrière) — 1 point sur 8
for (let i = 0; i < N; i += 8) {
    for (let s = 0; s < SLICES; s++) {
        edges.push([verts[s][i], verts[s+1][i]]);
    }
}

// ── 3. PROJECTION PERSPECTIVE PURE  x' = X/Z ─────────────────────────────────
// L'œil est en Z=0, l'écran imaginaire en Z=1
// On place l'objet à une distance focale de l'œil

const FL = 2.5; // distance focale (plus grand = moins de déformation)

function project(pt, rotX, rotY) {
    // Rotation Y (autour axe Y)
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    let x1 =  pt.x * cosY + pt.z * sinY;
    let z1 = -pt.x * sinY + pt.z * cosY;
    let y1 =  pt.y;

    // Rotation X (autour axe X)
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    let y2 = y1 * cosX - z1 * sinX;
    let z2 = y1 * sinX + z1 * cosX;
    let x2 = x1;

    // Translation : pousser l'objet devant l'œil
    const zCam = z2 + FL;
    if (zCam <= 0.01) return null;

    // LA FORMULE MAGIQUE : x' = X/Z
    const xp = x2 / zCam;
    const yp = y2 / zCam;

    // Conversion vers coordonnées écran (centre, Y inversé)
    const W = canvas.width, H = canvas.height;
    const scale = Math.min(W, H) * 0.45;
    return {
        sx: W/2 + xp * scale,
        sy: H/2 - yp * scale,
        z:  zCam   // pour la couleur / luminosité
    };
}

// ── 4. INTERACTION ────────────────────────────────────────────────────────────
let rotX = 0.35, rotY = 0.0;
let tRotX = 0.35, tRotY = 0.0;
let drag = false, px = 0, py = 0;
let zoom = 1.0; // via FL modifié

canvas.addEventListener('mousedown', e => { drag=true; px=e.clientX; py=e.clientY; document.body.style.cursor='grabbing'; });
window.addEventListener('mouseup',   () => { drag=false; document.body.style.cursor='grab'; });
window.addEventListener('mousemove', e => {
    if (!drag) return;
    tRotY += (e.clientX - px) * 0.007;
    tRotX += (e.clientY - py) * 0.007;
    px = e.clientX; py = e.clientY;
});
canvas.addEventListener('wheel', e => {
    zoom *= 1 - e.deltaY * 0.001;
    zoom = Math.max(0.4, Math.min(3, zoom));
}, { passive: true });

let lt = null;
canvas.addEventListener('touchstart', e => { lt = e.touches[0]; }, { passive:true });
canvas.addEventListener('touchmove',  e => {
    if (!lt) return;
    tRotY += (e.touches[0].clientX - lt.clientX) * 0.007;
    tRotX += (e.touches[0].clientY - lt.clientY) * 0.007;
    lt = e.touches[0];
}, { passive:true });

// ── 5. BOUCLE DE RENDU ────────────────────────────────────────────────────────
let t = 0;
function draw() {
    requestAnimationFrame(draw);
    t += 0.012;

    // Rotation automatique + inertie
    tRotY += 0.005;
    rotX += (tRotX - rotX) * 0.08;
    rotY += (tRotY - rotY) * 0.08;

    // Effacement avec traîne (motion blur léger)
    ctx.fillStyle = 'rgba(2,2,8,0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dessiner chaque arête
    const focalLen = FL / zoom;

    for (let e = 0; e < edges.length; e++) {
        const [a, b] = edges[e];

        // Appliquer les rotations et projeter
        const pa = projectPt(a, rotX, rotY, focalLen);
        const pb = projectPt(b, rotX, rotY, focalLen);
        if (!pa || !pb) continue;

        // Couleur selon profondeur Z et position Y (dégradé cyan→bleu violet)
        const depth = (pa.z + pb.z) * 0.5;
        const norm  = Math.max(0, Math.min(1, (depth - 1.5) / 2.5));
        const yNorm = Math.max(0, Math.min(1, ((a.y + b.y) * 0.5 + 1) * 0.5));

        // Hue : 180° (cyan) → 260° (bleu-violet) selon profondeur
        const hue = 180 + norm * 80;
        const light = 40 + yNorm * 40;
        const alpha = 0.15 + (1 - norm) * 0.75;

        ctx.beginPath();
        ctx.moveTo(pa.sx, pa.sy);
        ctx.lineTo(pb.sx, pb.sy);
        ctx.strokeStyle = `hsla(${hue},100%,${light}%,${alpha})`;
        ctx.lineWidth = 0.8 + (1 - norm) * 0.8;
        ctx.stroke();
    }
}

function projectPt(pt, rX, rY, fl) {
    const cosY = Math.cos(rY), sinY = Math.sin(rY);
    let x1 =  pt.x * cosY + pt.z * sinY;
    let z1 = -pt.x * sinY + pt.z * cosY;
    let y1 =  pt.y;

    const cosX = Math.cos(rX), sinX = Math.sin(rX);
    let y2 = y1 * cosX - z1 * sinX;
    let z2 = y1 * sinX + z1 * cosX;
    let x2 = x1;

    const zCam = z2 + fl;
    if (zCam <= 0.01) return null;

    // x' = X/Z  — la formule fondamentale
    const xp = x2 / zCam;
    const yp = y2 / zCam;

    const W = canvas.width, H = canvas.height;
    const s = Math.min(W, H) * 0.42 * zoom;
    return { sx: W/2 + xp*s, sy: H/2 - yp*s, z: zCam };
}

draw();
</script>
