<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieuvre 3D - Reconstruction Particulaire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* Harmonie avec le canvas */
            background: #0C0C0E;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Monospace', monospace;
            cursor: grab;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: absolute; top:0; left:0; z-index: 1; }
        
        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 200, 255, 0.4);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
            text-align: center;
            z-index: 10;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── SCENE SETUP ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);
camera.position.set(0, 0, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x0C0C0E, 1);
document.body.appendChild(renderer.domElement);

// ─── PARSER SVG CONTINU ──────────────────────────────────────────────────────
function sampleSVGPath(d, nSamples) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
    const total = path.getTotalLength();
    const pts = [];
    
    for (let i = 0; i <= nSamples; i++) {
        const t = (i / nSamples) * total;
        const p = path.getPointAtLength(t);
        pts.push(new THREE.Vector2(p.x - 400, -(p.y - 400)));
    }
    return pts;
}

const OCTOPUS_D = `M440.4,578.7c11.2-6,24.5-2.7,33.3,4.8,4.7,4,6.6,9,7.6,15l5.5.2c0-8-2.3-15.7-8.4-21.8-11.9-11.9-31-16.1-46.4-8.2-17,8.7-26.9,26.4-27.8,45.4-.3,7.3,0,15.5,2.2,22.4,14.5,45.9,56.2,100.3,108.1,93.4,19.3-2.6,36.6-11.8,49.5-26.3,20.5-23.1,19.5-56.8,10.2-85.7-7.5-23.4-19.6-44.2-35.2-63.2-12.1-14.8-25-28-39.2-40.7l-41.8-37.3c-15.6-15.3-28.1-32.4-37.6-53.6,32.5,12.9,66,19,101,17.8,37.4-1.3,71.2-8.6,107.9-7.8,16.6.3,31.2,6.2,43.7,16.8,15.6,13.2,23.5,31.7,21.5,52.3-1.3,13.6-4.6,26.4-10.2,38.9-15,33.8-58.8,41.1-90,24.6-7-3.7-13.5-8.8-17.6-15.5-8.8-14.3-10.3-32-5.4-47.7,1.8-5.7,5.1-9.9,10.6-12.2,8.2-3.4,18-3.2,25.5,1.9s8.8,11.2,10.6,18.5l5.5-.7c-1-9.4-3.4-17.6-9.9-24.1-7.9-7.9-19.1-9.7-30-8.6-21.5,2.2-29.3,20.3-32.4,40.7-4.1,27.3,7.2,53.1,30.1,68.7,19.2,13.1,41.9,18,65.2,16.2,24.8-1.9,46.5-13.5,62-32.8,10.2-12.7,16.2-26.7,21.5-42,13.3-38.6,5.3-80.6-22.9-110.3-21.2-22.2-49.3-34.8-80.3-35-13.3,0-25.7,1.1-38.8,2.5l-52.8,5.9c-15,1.7-29.6,1.7-44.2.1,27.2-8.2,47.9-20.6,60.1-46.1s12-27.6,17.4-42l17.7-46.7c6.1-16.2,20.6-42.5,36.9-46.8,30-7.9,65.1,4.4,77.5,34.2,13,31.2,6.9,75.8-26.5,84.9s-24.3,5.1-36.7,3.7c-15.2-1.8-29.1-11.2-33.4-26.1-5.2-18.3,5.6-46.9,26.2-47.1l.5-5.3c-21.3-2.8-36.4,24.8-36.6,44.2s16.4,40.5,37.8,45.5c12.4,2.9,24.1,2.3,36.7,1.2,22.1-2,39.9-14.5,49.5-34.5,7.3-15.2,9-31.4,8.1-48.3-2.3-44.6-37.4-79.4-82-81.9-13.1-.7-25.6-1.2-37.9,4-22.9,9.8-38.2,32.7-49.7,54.7-15.3,29.3-25.2,58-41.8,87.8s-34.5,20.6-55.5,19.8c16.1-20.9,31.7-48.3,29.4-73.5-1.3-14.8-4.5-29-9.3-43l-14.7-42.8c-6.3-18.5-12.5-36.3-16.7-55.4-4.6-21.1,1.9-37.9,15.5-54.2,17.9-21.4,46-29.8,72.7-21.4s24.3,10.5,34.2,19.2c15.2,13.4,18.8,33.5,9.6,51.3-7.2,14-20.5,21.2-36.2,19.9-13.4-1.1-23-10-23.9-23.8-.3-4.6.6-9.9,3.7-13s8-4.7,13.8-4.5l1.2-5.2c-11.9-2.5-22.8,3.5-25.6,15.4-3.1,13.5,1.7,29.2,14.3,36.4,16.1,9.3,37.6,7.7,52.5-3.8,19.5-15.1,25.9-42.2,17.1-64.8-4.2-10.7-11.1-19-19.4-26.6-12.4-11.3-27.1-18.3-43.2-23.1-19.2-5.7-38.7-5-57.5,2.9-29.1,12.4-52,37.7-59.4,68.8-6.4,26.6,9.1,73.6,18.1,102.2,6,19.2,11.4,37.7,14.7,57.5,1.3,7.9,1.2,15.4-1.8,22.8s-10.2,19.1-17.8,27.5c1.7-13.3,2.8-25,1.2-37.8-3.7-29.6-22-54.7-48.9-67.7-28.8,14.1-47.1,41.6-49.4,73.2s.5,20.7,1.6,32.2c-13.5-16.4-23-30.1-19.4-50.8,3.4-19.2,8.5-37.2,14.3-55.9,9.1-28.9,24.8-76.6,18.3-103.4-11.2-46.2-58.9-82.7-106-74s-63.7,24.5-74.3,54.5c-9.9,28,4.9,64.4,36.6,70.9,12.6,2.6,26.1,1.5,36.7-6.6s15.5-25.1,10.2-38.4c-3.9-9.7-13.7-13.3-23.9-11.7l.6,5.4c5.8,0,10.7,1,14,4.5,3.4,3.5,4.1,9.1,3.8,13.8-1.1,13.7-11,22.2-24.2,23.2s-28.5-5.9-35.7-19.6c-9.2-17.5-6.3-37.5,8.7-51s22.6-16.2,36.1-20.2c38.6-11.3,75.8,12.5,86.9,49.8,2.7,9.2,1.8,18.7-.3,28-9.9,43.8-28.8,80-38.5,125.4-7.2,33.9,7.1,60.5,27.8,87.7-24.2.2-45.7-.7-57.6-23.2-6.9-13.1-13-25.8-18.9-39.5s-15.2-34.7-24.5-51.6c-11.2-20.5-26.5-40.7-48.4-49-11.8-4.4-23.6-3.9-35.9-3.1-45.3,2.7-80.3,38.5-81.8,83.9-.5,16.7,1.3,32.6,8.8,47.4,9.8,19.4,27.2,31.3,48.7,33.4s24.9,1.9,37.5-1.2c21.1-5.2,37.4-23.1,37.2-45.4-.2-19.4-14.9-46.6-36.2-44.2-.1,1.1,0,3.9.3,5.3,20.8.4,31.6,29.8,25.7,48.1-4.7,14.5-18.4,23.6-33.3,25.1-13.2,1.4-26.2-.5-38.7-4.5-30.5-9.8-35.9-50.8-25.6-80.4s46.9-45.9,78-38.1c8.7,2.1,15.5,8.3,20.6,15.4,7.9,11.1,14.2,22.8,19,35.6l16.5,44c6.5,17.3,12.7,34.1,22.2,50,7.8,13,20.1,22.2,33.5,28.8s14.1,5.5,21.2,8.2c-15.3,1.5-29.5,1.4-44.4-.2l-53.5-6c-37.3-4.2-66.3-5-98.4,16.1-42.3,27.9-59.2,79.6-42.3,127.3,5.7,16.2,12.2,31.3,23.8,44.4,14.6,16.5,33.4,26.9,55.5,29.4,21.8,2.4,43.3-.9,62.4-11.6s29.2-23.2,34.6-41.5c6.9-23.3,1.2-59.5-18.2-68.7-10.9-5.1-24.1-5.2-34.8,0-11.1,5.5-16.1,16.9-16.9,29.2l5.4.5c1.8-6.6,3.6-12.6,8.8-16.9,9.2-7.6,23.9-7.7,32.9.5s5.2,8.7,6.2,13.3c3.2,15,1.1,30.7-7.2,43.6s-12.1,12.4-20,16.1c-16.6,7.9-35.4,9.1-52.9,3.8-17.7-5.3-30.6-18.3-36.7-35.6-9-25.6-13.5-53.3,4.2-75.3,9.6-11.9,22.4-21,37.4-24.8,20.5-5.1,54.8-.7,78,1.9,54,6,93.4,6.8,146.6-13.9-9.8,22.8-24,41.5-41.5,57.3l-31.1,27.6c-34.9,30.9-66.1,64.4-80.8,109.3-12,36.4-9.5,75.1,23.2,98.1,18.1,12.8,40.6,18.6,62.4,12.8,17.2-4.6,31.6-14.5,44-27.2,15.8-16.2,26.7-35.5,35.3-56.3s4.9-59.6-20.6-74.9c-14.8-8.9-34.2-5.9-46.8,5.3-7,6.2-10.5,14-10,23.5l5.3-.2c.9-5.7,2.4-10,6.4-13.9,9.1-8.9,24.3-12.2,35.7-5.2,10.3,6.3,16.9,18.6,17,30.7s-.7,13.8-3,19.7c-10,24.7-29.2,47.9-52,62-18.1,11.2-41.7,8.2-55.8-7.9-7-8-9.9-18.4-8.2-28.9,2.6-16,8.7-30.4,17.6-43.9,9.3-14,20-26.3,32.4-37.9l59-55.1c21.5-20.1,37.4-43.6,49.3-71.6,12.2,30.5,31.3,55.2,54.9,77.2l59,55c21,21.9,40.8,47.8,44.3,78.4s-3.3,22.6-11.9,30.3c-16.2,14.3-38.6,14.4-56.3,1.9-21.4-15.1-38.4-35.9-48.3-60.5-2.2-5.6-2.7-12.6-2.7-18.7,0-12.5,6.9-25.3,18.3-31.4Z`;

const basePoints = sampleSVGPath(OCTOPUS_D, 600); 
let maxR = 0;
basePoints.forEach(p => { maxR = Math.max(maxR, p.length()); });
const scaleFactor = 160 / maxR;
const pts = basePoints.map(p => p.multiplyScalar(scaleFactor));
const countPts = pts.length;

const group = new THREE.Group();
scene.add(group);

const pMult = 10; 
const pCount = countPts * pMult;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pColors = new Float32Array(pCount * 3);
const pOriginals = new Float32Array(pCount * 3);
const pSpeeds = new Float32Array(pCount);

let pIdx = 0;
const colorObj = new THREE.Color();
for(let m=0; m<pMult; m++) {
    for(let i=0; i<countPts; i++) {
        const pt = pts[i];
        const idx = pIdx * 3;
        
        pOriginals[idx]   = pt.x;
        pOriginals[idx+1] = pt.y;
        pOriginals[idx+2] = (Math.random() - 0.5) * 8; 
        
        pPos[idx]   = (Math.random() - 0.5) * 600;
        pPos[idx+1] = (Math.random() - 0.5) * 600;
        pPos[idx+2] = (Math.random() - 0.5) * 600;
        
        colorObj.setHSL(0.52 + (i / countPts) * 0.08, 1.0, 0.5);
        pColors[idx]   = colorObj.r;
        pColors[idx+1] = colorObj.g;
        pColors[idx+2] = colorObj.b;
        
        pSpeeds[pIdx] = 0.02 + Math.random() * 0.04;
        pIdx++;
    }
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

// Créer 3 systèmes de particules pour l'effet de décalage chromatique
const createChannelParticleSystem = (channelIndex) => {
    const channelGeo = new THREE.BufferGeometry();
    const channelPos = new Float32Array(pPos);
    const channelColors = new Float32Array(pCount * 3);
    
    // Remplir avec une couleur de canal unique
    for(let i = 0; i < pCount * 3; i += 3) {
        channelColors[i] = channelIndex === 0 ? 1 : 0;           // R
        channelColors[i+1] = channelIndex === 1 ? 1 : 0;         // G
        channelColors[i+2] = channelIndex === 2 ? 1 : 0;         // B
    }
    
    channelGeo.setAttribute('position', new THREE.BufferAttribute(channelPos, 3));
    channelGeo.setAttribute('color', new THREE.BufferAttribute(channelColors, 3));
    
    const channelMaterial = new THREE.PointsMaterial({
        size: 1.6,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
    });
    
    const particles = new THREE.Points(channelGeo, channelMaterial);
    
    // Créer un halo pour ce canal
    const haloGeo = new THREE.BufferGeometry();
    const haloPos = new Float32Array(pPos);
    const haloColors = new Float32Array(pCount * 3);
    
    for(let i = 0; i < pCount * 3; i += 3) {
        haloColors[i] = channelIndex === 0 ? 1 : 0;
        haloColors[i+1] = channelIndex === 1 ? 1 : 0;
        haloColors[i+2] = channelIndex === 2 ? 1 : 0;
    }
    
    haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
    haloGeo.setAttribute('color', new THREE.BufferAttribute(haloColors, 3));
    
    const haloMaterial = new THREE.PointsMaterial({
        size: 6.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending
    });
    
    const halo = new THREE.Points(haloGeo, haloMaterial);
    
    return { particles, halo, geoRef: channelGeo, haloGeoRef: haloGeo };
};

const redChannelData = createChannelParticleSystem(0);
const greenChannelData = createChannelParticleSystem(1);
const blueChannelData = createChannelParticleSystem(2);

// Ajouter halos en premier (arrière-plan)
group.add(redChannelData.halo);
group.add(greenChannelData.halo);
group.add(blueChannelData.halo);

// Puis ajouter les particules principales
group.add(redChannelData.particles);
group.add(greenChannelData.particles);
group.add(blueChannelData.particles);

// Raccourcis pour compatibilité
const redChannel = redChannelData.particles;
const greenChannel = greenChannelData.particles;
const blueChannel = blueChannelData.particles;
const redHalo = redChannelData.halo;
const greenHalo = greenChannelData.halo;
const blueHalo = blueChannelData.halo;

// Garder aussi le système original pour la base
const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({ 
    size: 1.6, 
    vertexColors: true, 
    transparent: true, 
    opacity: 0.95, 
    blending: THREE.AdditiveBlending 
}));
group.add(particleSystem);

const clock = new THREE.Clock();

function updateChromaticAberration(time) {
    // Décalage chromatique de base (ralenti)
    const offsetX = Math.sin(time * 0.35) * 8;
    const offsetY = Math.cos(time * 0.3) * 8;
    const offsetZ = Math.sin(time * 0.25) * 6;
    
    // Paramètres de distortion scanlines (ralentis)
    const scanlineAmplitude = Math.sin(time * 0.75) * 25 + 30;
    const scanlineFreq = 0.08;
    const scanlineSpeed = time * 1;
    
    // Fonction pour appliquer la distortion scanlines
    const applyScanlineDistortion = (posArray, baseArray, offsetDX, offsetDY, offsetDZ) => {
        for(let i = 0; i < pCount * 3; i += 3) {
            const baseX = baseArray[i];
            const baseY = baseArray[i+1];
            const baseZ = baseArray[i+2];
            
            // Distortion basée sur la hauteur Y
            const distortionX = Math.sin(baseY * scanlineFreq + scanlineSpeed) * scanlineAmplitude;
            const distortionY = Math.cos(baseX * scanlineFreq + scanlineSpeed) * (scanlineAmplitude * 0.5);
            
            posArray[i]   = baseX + distortionX + offsetDX;
            posArray[i+1] = baseY + distortionY + offsetDY;
            posArray[i+2] = baseZ + offsetDZ;
        }
    };
    
    // Appliquer au canal rouge
    const redPos = redChannel.geometry.attributes.position.array;
    const redHaloPos = redHalo.geometry.attributes.position.array;
    applyScanlineDistortion(redPos, pPos, offsetX * 0.8, offsetY * 0.6, 0);
    applyScanlineDistortion(redHaloPos, pPos, offsetX * 0.8, offsetY * 0.6, 0);
    redChannel.geometry.attributes.position.needsUpdate = true;
    redHalo.geometry.attributes.position.needsUpdate = true;
    
    // Appliquer au canal vert
    const greenPos = greenChannel.geometry.attributes.position.array;
    const greenHaloPos = greenHalo.geometry.attributes.position.array;
    applyScanlineDistortion(greenPos, pPos, 0, 0, 0);
    applyScanlineDistortion(greenHaloPos, pPos, 0, 0, 0);
    greenChannel.geometry.attributes.position.needsUpdate = true;
    greenHalo.geometry.attributes.position.needsUpdate = true;
    
    // Appliquer au canal bleu
    const bluePos = blueChannel.geometry.attributes.position.array;
    const blueHaloPos = blueHalo.geometry.attributes.position.array;
    applyScanlineDistortion(bluePos, pPos, -offsetX * 0.8, -offsetY * 0.6, offsetZ);
    applyScanlineDistortion(blueHaloPos, pPos, -offsetX * 0.8, -offsetY * 0.6, offsetZ);
    blueChannel.geometry.attributes.position.needsUpdate = true;
    blueHalo.geometry.attributes.position.needsUpdate = true;
}

function updateMathTransforms(time) {
    const posArr = particleSystem.geometry.attributes.position.array;
    const cycle = time % 18;  // Boucle augmentée de 9 à 18 secondes
    const exploding = cycle > 11; 
    
    for(let i=0; i<pCount*3; i+=3) {
        const pIdx = i/3;
        const s = pSpeeds[pIdx];
        if (!exploding) {
            posArr[i]   += (pOriginals[i] - posArr[i]) * s * 1.8;
            posArr[i+1] += (pOriginals[i+1] - posArr[i+1]) * s * 1.8;
            posArr[i+2] += (pOriginals[i+2] - posArr[i+2]) * s * 1.8;
        } else {
            const power = (cycle - 11) * 3;
            posArr[i]   += Math.sin(pIdx + time * 0.5) * power * 0.3;
            posArr[i+1] += Math.cos(pIdx - time * 0.5) * power * 0.3;
            posArr[i+2] += Math.sin(i + time * 0.5) * power * 0.4;
        }
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;
}

let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotX = 0.1, rotY = -0.3;
let targetRotX = 0.1, targetRotY = -0.3;
let zoom = 1;

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    rotX += (targetRotX - rotX) * 0.05;
    rotY += (targetRotY - rotY) * 0.05;
    group.rotation.x = rotX;
    group.rotation.y = rotY;
    
    targetRotY += 0.00075;  // Réduit de 0.0015 à 0.00075 pour ralentir 
    camera.position.z = 400 / zoom;
    
    updateMathTransforms(time);
    updateChromaticAberration(time);
    
    renderer.render(scene, camera);
}

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mouseleave', () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
    if (!isDragging) return;
    targetRotY += (e.clientX - prevMouse.x) * 0.005;
    targetRotX += (e.clientY - prevMouse.y) * 0.005;
    prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
    zoom *= 1 - e.deltaY * 0.001;
    zoom = Math.max(0.4, Math.min(2.5, zoom));
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
