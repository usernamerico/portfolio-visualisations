<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kering Luxe 3D - Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #011611; /* Vert très sombre/émeraude luxe */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
            cursor: grab;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; position: absolute; top:0; left:0; z-index: 1; }
        
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(1, 22, 17, 0.9);
            border: 1px solid rgba(184, 134, 11, 0.3); /* Or discret */
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        .btn {
            display: block;
            width: 100%;
            background: transparent;
            border: 1px solid rgba(184, 134, 11, 0.3);
            color: #d4af37; /* Couleur Or */
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-align: left;
            transition: all 0.3s ease;
        }
        .btn:last-child { margin-bottom: 0; }
        .btn:hover {
            background: rgba(184, 134, 11, 0.1);
            border-color: #d4af37;
        }
        .btn.active {
            background: #d4af37;
            color: #011611;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212,175,55,0.4);
        }
    </style>
</head>
<body>

<div id="ui">
    <button class="btn active" onclick="switchMode(0)">1. RECONSTRUCTION PARTICULAIRE</button>
    <button class="btn" onclick="switchMode(1)">2. EXTRUSION & LASER 3D</button>
    <button class="btn" onclick="switchMode(2)">3. VAGUE CINÉTIQUE LUXE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── SCENE SETUP ─────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);
camera.position.set(0, 0, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x011611, 1);
document.body.appendChild(renderer.domElement);

// ─── PARSER SVG CONTINU ──────────────────────────────────────────────────────
function sampleSVGPath(d, nSamples) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
    const total = path.getTotalLength();
    const pts = [];
    for (let i = 0; i <= nSamples; i++) {
        const t = (i / nSamples) * total;
        const p = path.getPointAtLength(t);
        // Ajustement centrage automatique
        pts.push(new THREE.Vector2(p.x - 500, -(p.y - 350)));
    }
    return pts;
}

// Tracé approximatif du concept Chouette + Diamant combiné
const LOGO_D = "M 500,200 C 420,200 340,110 320,100 C 350,130 450,220 480,240 C 490,245 495,255 495,260 C 480,265 470,280 470,300 C 470,330 500,350 500,350 C 500,350 530,330 530,300 C 530,280 520,265 505,260 C 505,255 510,245 520,240 C 550,220 650,130 680,100 C 660,110 580,200 500,200 Z M 500,350 L 440,400 L 460,480 L 500,530 L 540,480 L 560,400 Z M 440,400 L 560,400 M 460,480 L 540,480 M 500,350 L 500,530 M 440,400 L 500,480 L 560,400 M 460,480 L 500,400 L 540,480";

const basePoints = sampleSVGPath(LOGO_D, 600);
let maxR = 0;
basePoints.forEach(p => { maxR = Math.max(maxR, p.length()); });
const scaleFactor = 160 / maxR;
const pts = basePoints.map(p => p.multiplyScalar(scaleFactor));
const countPts = pts.length;

const group = new THREE.Group();
scene.add(group);

let currentMode = 0;
let particleSystem, extrusionSystem, waveSystem;

/* ─── 1. MODE PARTICULES (OR / ROSE GOLD) ─── */
const pMult = 6; 
const pCount = countPts * pMult;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pColors = new Float32Array(pCount * 3);
const pOriginals = new Float32Array(pCount * 3);
const pSpeeds = new Float32Array(pCount);

let pIdx = 0;
const colorObj = new THREE.Color();
for(let m=0; m<pMult; m++) {
    for(let i=0; i<countPts; i++) {
        const pt = pts[i];
        const idx = pIdx * 3;
        
        pOriginals[idx]   = pt.x;
        pOriginals[idx+1] = pt.y;
        pOriginals[idx+2] = (Math.random() - 0.5) * 8;
        
        pPos[idx]   = (Math.random() - 0.5) * 600;
        pPos[idx+1] = (Math.random() - 0.5) * 600;
        pPos[idx+2] = (Math.random() - 0.5) * 600;
        
        // Teinte Or et Or Rose alternée
        if(i % 2 === 0) {
            colorObj.setHex(0xd4af37); // Or classique
        } else {
            colorObj.setHex(0xb76e79); // Or rose
        }
        pColors[idx]   = colorObj.r;
        pColors[idx+1] = colorObj.g;
        pColors[idx+2] = colorObj.b;
        
        pSpeeds[pIdx] = 0.02 + Math.random() * 0.04;
        pIdx++;
    }
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 1.6, vertexColors: true, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending }));
group.add(particleSystem);


/* ─── 2. MODE EXTRUSION LASER OR ─── */
const extLayers = 35;
const extSpacing = 3.5;
const extGeo = new THREE.BufferGeometry();
const extPos = [];
const extColors = [];

for(let l=0; l<extLayers; l++) {
    const zPos = (l - extLayers/2) * extSpacing;
    for(let i=0; i<countPts-1; i++) {
        extPos.push(pts[i].x, pts[i].y, zPos);
        extPos.push(pts[i+1].x, pts[i+1].y, zPos);
        extColors.push(0,0,0, 0,0,0);
    }
}
for(let i=0; i<countPts; i+=12) {
    for(let l=0; l<extLayers-1; l++) {
        const z0 = (l - extLayers/2) * extSpacing;
        const z1 = (l + 1 - extLayers/2) * extSpacing;
        extPos.push(pts[i].x, pts[i].y, z0);
        extPos.push(pts[i].x, pts[i].y, z1);
        extColors.push(0,0,0, 0,0,0);
    }
}

extGeo.setAttribute('position', new THREE.Float32BufferAttribute(extPos, 3));
extGeo.setAttribute('color', new THREE.Float32BufferAttribute(extColors, 3));
extrusionSystem = new THREE.LineSegments(extGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
extrusionSystem.visible = false;
group.add(extrusionSystem);


/* ─── 3. MODE VAGUE CINÉTIQUE FLUIDE ─── */
const waveLayers = 40;
const waveSpacing = 6;
const waveGeo = new THREE.BufferGeometry();
const wavePos = new Float32Array(waveLayers * (countPts - 1) * 2 * 3);
const waveColors = new Float32Array(waveLayers * (countPts - 1) * 2 * 3);

waveGeo.setAttribute('position', new THREE.BufferAttribute(wavePos, 3));
waveGeo.setAttribute('color', new THREE.BufferAttribute(waveColors, 3));
waveSystem = new THREE.LineSegments(waveGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
waveSystem.visible = false;
group.add(waveSystem);


// ─── ANIMATION ET MATHÉMATIQUES ──────────────────────────────────────────────
const clock = new THREE.Clock();

function updateMathTransforms(time) {
    if (currentMode === 0) {
        const posArr = particleSystem.geometry.attributes.position.array;
        const cycle = time % 8;
        const exploding = cycle > 5.0;
        
        for(let i=0; i<pCount*3; i+=3) {
            const pIdx = i/3;
            const s = pSpeeds[pIdx];
            if (!exploding) {
                posArr[i]   += (pOriginals[i] - posArr[i]) * s * 2;
                posArr[i+1] += (pOriginals[i+1] - posArr[i+1]) * s * 2;
                posArr[i+2] += (pOriginals[i+2] - posArr[i+2]) * s * 2;
            } else {
                const power = (cycle - 5.0) * 4;
                posArr[i]   += Math.sin(pIdx + time) * power * 0.3;
                posArr[i+1] += Math.cos(pIdx - time) * power * 0.3;
                posArr[i+2] += Math.sin(i + time) * power * 0.4;
            }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    if (currentMode === 1) {
        const colArr = extrusionSystem.geometry.attributes.color.array;
        const totalPositions = extPos.length / 3;
        const posArr = extPos; 
        
        const maxDepth = (extLayers * extSpacing) / 2;
        const laserZ = Math.sin(time * 2.0) * maxDepth;
        
        let cPtr = 0;
        for(let i=0; i<totalPositions; i++) {
            const zCoord = posArr[i*3 + 2];
            const d = Math.abs(zCoord - laserZ);
            const factor = Math.exp(-d * 0.08);
            
            // Nuances dorées scintillantes au passage du scan
            colArr[cPtr++] = 0.5 + factor * 0.5; // R
            colArr[cPtr++] = 0.4 + factor * 0.4; // G
            colArr[cPtr++] = 0.1 + factor * 0.2; // B
        }
        extrusionSystem.geometry.attributes.color.needsUpdate = true;
    }

    if (currentMode === 2) {
        const posArr = waveSystem.geometry.attributes.position.array;
        const colArr = waveSystem.geometry.attributes.color.array;
        let pPtr = 0, cPtr = 0;
        
        for(let l=0; l<waveLayers; l++) {
            const baseZ = (l - waveLayers/2) * waveSpacing;
            const waveYOffset = Math.sin(l * 0.15 - time * 2.5) * 15;
            const waveXOffset = Math.cos(l * 0.1 + time * 1.2) * 8;
            
            // Dégradé Or à Or Rose le long des strates
            const ratio = l / waveLayers;
            colorObj.setHex(0xd4af37);
            if(ratio > 0.5) {
                colorObj.lerp(new THREE.Color(0xb76e79), (ratio - 0.5) * 2);
            }
            
            for(let i=0; i<countPts - 1; i++) {
                posArr[pPtr++] = pts[i].x + waveXOffset;
                posArr[pPtr++] = pts[i].y + waveYOffset;
                posArr[pPtr++] = baseZ;
                
                posArr[pPtr++] = pts[i+1].x + waveXOffset;
                posArr[pPtr++] = pts[i+1].y + waveYOffset;
                posArr[pPtr++] = baseZ;
                
                colArr[cPtr++] = colorObj.r; colArr[cPtr++] = colorObj.g; colArr[cPtr++] = colorObj.b;
                colArr[cPtr++] = colorObj.r; colArr[cPtr++] = colorObj.g; colArr[cPtr++] = colorObj.b;
            }
        }
        waveSystem.geometry.attributes.position.needsUpdate = true;
        waveSystem.geometry.attributes.color.needsUpdate = true;
    }
}

// ─── CORE ANIMATION LOOP ─────────────────────────────────────────────────────
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotX = 0.2, rotY = -0.4;
let targetRotX = 0.2, targetRotY = -0.4;
let zoom = 1;

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    rotX += (targetRotX - rotX) * 0.05;
    rotY += (targetRotY - rotY) * 0.05;
    group.rotation.x = rotX;
    group.rotation.y = rotY;
    
    targetRotY += 0.0015; // Rotation automatique lente
    camera.position.z = 400 / zoom;
    
    updateMathTransforms(time);
    
    renderer.render(scene, camera);
}

// ─── INTERFACE TRIGGER ───────────────────────────────────────────────────────
window.switchMode = function(index) {
    currentMode = index;
    const btns = document.querySelectorAll('.btn');
    btns.forEach((b, i) => b.classList.toggle('active', i === index));
    
    particleSystem.visible = (index === 0);
    extrusionSystem.visible = (index === 1);
    waveSystem.visible = (index === 2);
};

// ─── INTERACTIONS SOURIS / TOUCH ─────────────────────────────────────────────
renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mouseleave', () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
    if (!isDragging) return;
    targetRotY += (e.clientX - prevMouse.x) * 0.005;
    targetRotX += (e.clientY - prevMouse.y) * 0.005;
    prevMouse = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
    zoom *= 1 - e.deltaY * 0.001;
    zoom = Math.max(0.5, Math.min(2.0, zoom));
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
