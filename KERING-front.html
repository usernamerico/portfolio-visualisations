<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Kering - Scan Frontal Fixe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #011611;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas { display: block; position: absolute; top:0; left:0; z-index: 1; }
    </style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);

// REGLAGE PERSPECTIVE : Caméra parfaitement centrée en face (X=0, Y=0)
camera.position.set(0, 0, 300);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x011611, 1);
document.body.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

function samplePathData(d, nSamples) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    svg.appendChild(path);
    const total = path.getTotalLength();
    const points = [];
    for (let i = 0; i <= nSamples; i++) {
        const t = (i / nSamples) * total;
        const p = path.getPointAtLength(t);
        points.push(new THREE.Vector3(p.x - 150, -(p.y - 49), 0));
    }
    return points;
}

];

let originalPoints = [];
svgPaths.forEach(path => {
    originalPoints = originalPoints.concat(samplePathData(path, 450));
});

const countPts = originalPoints.length;
const pMult = 6; 
const totalParticles = countPts * pMult;

const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(totalParticles * 3);
const pColors = new Float32Array(totalParticles * 3);
const pOriginals = new Float32Array(totalParticles * 3);
const pOffsets = new Float32Array(totalParticles); 

let pIdx = 0;
const colorObj = new THREE.Color();

for (let m = 0; m < pMult; m++) {
    for (let i = 0; i < countPts; i++) {
        const pt = originalPoints[i];
        const idx = pIdx * 3;
        
        pOriginals[idx]   = pt.x * 1.5; 
        pOriginals[idx+1] = pt.y * 1.5;
        pOriginals[idx+2] = (Math.random() - 0.5) * 2;
        
        pPos[idx]   = pOriginals[idx];
        pPos[idx+1] = pOriginals[idx+1];
        pPos[idx+2] = pOriginals[idx+2];
        
        pOffsets[pIdx] = ((pt.y + 49) / 98) * 1.8 + Math.random() * 0.3;
        
        if (i % 2 === 0) {
            colorObj.setHex(0xe5c158); 
        } else {
            colorObj.setHex(0xc58b93); 
        }
        pColors[idx]   = colorObj.r;
        pColors[idx+1] = colorObj.g;
        pColors[idx+2] = colorObj.b;
        
        pIdx++;
    }
}

pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({ 
    size: 1.3, 
    vertexColors: true, 
    transparent: true, 
    opacity: 0.9, 
    blending: THREE.AdditiveBlending 
}));
group.add(particleSystem);

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    
    // FIX DE LA PERSPECTIVE : Suppression complète de toute rotation parasite du groupe (rotation.y = 0)
    // Le logo reste parfaitement rigide, droit et de face.
    group.rotation.y = 0;
    
    const posArr = particleSystem.geometry.attributes.position.array;
    
    const loopDuration = 10.0;
    const currentTime = time % loopDuration;
    
    const isScanning = currentTime < 4.0;
    const progress = currentTime / 4.0; 

    for (let i = 0; i < totalParticles * 3; i += 3) {
        const idx = i / 3;
        const offset = pOffsets[idx];
        
        const origX = pOriginals[i];
        const origY = pOriginals[i+1];
        const origZ = pOriginals[i+2];
        
        if (isScanning) {
            const waveFront = progress * 2.3; 
            
            if (waveFront > offset && waveFront < offset + 0.5) {
                const distFromFront = Math.abs((waveFront - offset) - 0.25);
                const intensity = Math.max(0, 1.0 - distFromFront / 0.25);
                
                // Ampleur fluide conservée
                posArr[i]   = origX + Math.sin(idx + time * 5) * intensity * 12;
                posArr[i+1] = origY + intensity * 38 + Math.cos(idx) * intensity * 5;
                posArr[i+2] = origZ + Math.sin(time * 8 + idx) * intensity * 28;
            } else {
                posArr[i]   += (origX - posArr[i]) * 0.08;
                posArr[i+1] += (origY - posArr[i+1]) * 0.08;
                posArr[i+2] += (origZ - posArr[i+2]) * 0.08;
            }
        } else {
            posArr[i]   += (origX - posArr[i]) * 0.15;
            posArr[i+1] += (origY - posArr[i+1]) * 0.15;
            posArr[i+2] += (origZ - posArr[i+2]) * 0.15;
        }
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
